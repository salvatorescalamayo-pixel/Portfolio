<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salvatore Scala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000;              /* the writing, and only the writing */
    --chrome:#475569;        /* everything at the foot of the page */
    --paper:#fff;
    --pale:#cbd5e1;          /* where a character waits before it is read */
    --pad:1rem;
  }
  @media (min-width:48rem){ :root{ --pad:2rem } }
  @media (min-width:80rem){ :root{ --pad:4rem } }

  *{box-sizing:border-box}
  /* Only the 400 cut is loaded; this makes sure the browser never fakes a
     heavier one anywhere on the page. */
  html{font-synthesis:none;-webkit-font-synthesis:none}
  /* Nothing on this site scrolls. Every view is built to sit on one screen. */
  html,body{height:100%;overflow:hidden}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    flex-direction:column;
  }

  /* The writing sits in the middle of the page and starts at the left margin.
     The page itself scrolls — nothing is trapped in an inner box with a
     scrollbar nobody can see. margin:auto rather than align-items:center, so
     that content taller than the screen grows downward instead of being
     clipped off the top. Room is left at the foot for the fixed bar. */
  main{
    flex:1;
    min-height:0;                       /* so the writing can never push the footer off */
    display:flex;
    padding:6vh var(--pad) 2rem;
    position:relative;                  /* the zine lies over whatever is here */
  }
  /* A page of the zine, laid over the page you were on. Nothing underneath is
     taken down or moved — the writing, the pieces, the bio are all still
     there, and the moment you press anything else the sheet is lifted off
     them again. The pages are stacked in the same place so one can be pulled
     up over the last without either of them moving. */
  .zine{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:30;
  }
  .zine.on{display:flex}
  /* One or the other. The square is not a sheet laid over the writing, it is
     the other thing this page can be — so the writing goes, rather than
     standing back behind it. The circle brings it back. */
  #stage{transition:opacity .22s ease-out}
  main.leafing #stage{opacity:0;pointer-events:none}
  .zine img{
    position:absolute;
    display:block;
    width:auto;height:auto;
    max-width:min(100%,26rem);
    max-height:100%;
    /* A page comes up out of the paper on opacity alone. Never two at once:
       the three sheets are not cut to the same outline, so one lying behind
       another shows past its edges — and taking it away afterwards is a
       change happening after the picture has already landed. Whatever is
       there goes back to white first, and the next one comes up out of that. */
    opacity:0;
    transition:opacity .42s ease-out;
    /* The scan keeps the paper's own grain and the light it was shot in, so
       it is left alone here — no filter, no flattening. The one thing added
       is the lift off the page, which is what a sheet on a sheet does. */
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.13));
  }
  .zine img.up{opacity:1}
  .zine img.down{opacity:0;transition:opacity .22s ease-in}
  /* What the square hands you now is a photograph and the line that was
     written off it. The two travel as one block — the picture centred, the
     writing hanging off its foot — so the line is never floating somewhere
     on the page on its own. The block fades as a whole, the way a sheet did. */
  /* Static, not absolute: the layer already centres its one child, and taking
     the block out of flow left it hanging off the right edge.
     Both halves are given their height up front rather than being allowed to
     find it. The line is written a character at a time, so a block sized to
     its contents would grow under the picture and lift it a few pixels with
     every word — the picture has landed, and nothing that happens afterwards
     is allowed to move it. */
  /* Every photograph lands on exactly the same two lines, whatever is written
     under it: the writing below is given the height of the longest of the
     twelve, measured once, so a short line reserves the same room as a long
     one and the block is the same size every time. Centred whole rather than
     on the picture alone — with the longest line running to thirteen of them,
     a picture pinned to the middle of the page would push its own caption off
     the foot of it. */
  /* One sheet: the photograph and the note under it come as a single scan, so
     there is nothing here to lay out against anything else. It hangs on the
     middle of the page and takes the height it is given. */
  /* The sheet fills the layer and centres what it holds, rather than shrinking
     to fit it: a box with no height of its own gives the sheet's own max-height
     nothing to be a share of, and the scan collapses to nothing. */
  /* The sheet itself does not fade — its pieces do, one at a time and out of
     order. So the block is simply there, and everything that moves is below. */
  .zine .leaf{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
  }
  .zine .leaf.up{opacity:1}
  /* Leaving is one movement, though — the whole sheet out through a blur. */
  .zine .leaf.down{
    opacity:0;filter:blur(20px);
    transition:filter .26s ease-in,opacity .26s ease-in;
  }
  /* The picture still loads and still lays itself out, because that is what
     sets the size the grid is cut to. It just is not the thing you look at. */
  .zine .leaf img.ruler{opacity:0}
  .zine .mosaic{position:absolute}
  /* One piece of the sheet. It carries the whole picture as a background,
     shifted to its own cell, and arrives out of focus and not there — the same
     half second, on the same curve, as the page this is taken from. */
  .zine .piece{
    position:absolute;
    background-repeat:no-repeat;
    opacity:0;
    transition:filter .5s ease,opacity .5s ease;
  }
  .zine .piece.visible{opacity:1;filter:blur(0px)}
  /* A fixed box the picture is fitted inside, so pictures of different shapes
     all land on the same two lines and none of them resizes the block. */
  /* The picture keeps its own shape and sits on the middle of the block; the
     writing under it is free to run wider than the photograph does. */
  .zine .leaf img{
    display:block;
    width:auto;max-width:min(92vw,42rem);height:auto;max-height:94%;
    object-fit:contain;
    opacity:1;transition:none;
  }
  /* The caption is written, not printed: it arrives a character at a time
     under the picture, at the pace the rest of the site writes at. Its height
     is the space left over, taken whether or not there are words in it yet,
     and a long one scrolls inside that rather than pushing the picture. */
  /* Nothing here scrolls, in either direction: the sheet is handed to you
     whole, at whatever size the page can carry it. */
  @media (max-width:48rem){
    .zine .leaf img{max-width:88vw;max-height:88%}
  }
  /* Work gets the page nearly edge to edge. The writing keeps the wide margin
     it needs to be readable; pictures do not, and giving it back to them is
     the only way to make them bigger while the grid stays two across. */
  /* Every view keeps the side margin the rule sets at the foot, so nothing on
     the page ever reaches past either end of that line. Only the vertical
     breathing room changes. */
  main.wide{padding:2vh var(--pad) 1rem}
  #stage{width:100%;margin:auto;max-height:100%}

  .prose{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-weight:400;
    font-size:1.125rem;
    line-height:1.625;
    text-align:left;
    white-space:pre-wrap;
    /* No measure of its own — the writing runs the width of the column, the
       way the reference does. */
  }
  @media (min-width:48rem){ .prose{font-size:1.25rem} }
  @media (min-width:64rem){ .prose{font-size:1.875rem} }
  /* The bio is not an aphorism. Those are a line or two and want all the room
     the page has; this is six of them, and set at that size it runs off the
     bottom and straight through the circle, the square and the mark on any
     laptop screen. So it keeps the face and the leading and gives up the
     size — which is what a bio is anyway: reading matter, not a headline. */
  /* The bio is nineteen lines of verse that have to sit on one screen with no
     scroll, so every pixel of height spent is a pixel of size given up. Two
     places to get them back, and both of them suit verse anyway:
     — the leading comes in from 1.625 to 1.4. Verse is set close; the line
       breaks are already doing the work the leading does in prose.
     — the break between blocks comes down from a whole blank line to three
       quarters of one. Five blank lines were a fifth of the height.
     What that buys is size, and size is what fills the width. */
  .prose.bio{
    font-size:1.875rem;                 /* what the home page is set in */
    line-height:1.4;
  }
  /* Set in the bio's own type, a size down, and it keeps the left margin the
     verse above it starts on. */
  .cv-link{
    display:inline-block;margin-top:1.6em;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.9em;letter-spacing:.04em;
    color:inherit;text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:2px;
    opacity:0;transition:opacity .5s ease-out;
  }
  .cv-link.on{opacity:.75}
  .cv-link:hover{opacity:1}
  .prose.bio p{margin:0 0 .75em}
  .prose.bio p:last-child{margin-bottom:0}
  /* And the reading view opens higher up the page than the writing does, for
     the same reason. */
  main.reading{padding-top:2rem}
  /* No step up at the wide breakpoint the way the writing has one. Set as
     verse the bio is twenty-one lines rather than eleven, and the extra size
     buys nothing a bio wants — it only pushes the last line off the screen. */
  /* And where even that is too much — a phone, where the same words break into
     three times the lines — the rest is scrolled to rather than being allowed
     to run out through the foot of the page.
     The scroll has to sit here and not on the writing itself: a percentage
     max-height resolves against the containing block's height, #stage's height
     is auto, and a percentage against auto is simply dropped. #stage is the
     one in the chain whose cap does resolve — main's height is settled by the
     flex column — so #stage is where the room runs out and where the scrolling
     belongs. No bar: the site does not show one anywhere. */
  /* And it does not scroll after all. The verse is fitted to the room it has,
     so there is never anything below the fold to reach — and leaving the box
     scrollable meant a pixel of rounding was enough to put the C.V. just past
     its bottom edge, present and unreachable without a drag. Nothing on this
     page is arrived at by scrolling; it is all simply there. */
  main.reading #stage{overflow-y:hidden}

  /* A character does not exist until it is written. It arrives pale and goes
     to ink over .15s, so at any moment only the last five or six are still
     grey — a short wake at the writing edge, and nothing at all ahead of it.
     The spans hold their place while hidden, so the line never reflows as it
     fills. `forwards` and not `both`: with `both` every character would take
     the opening frame at once and the whole sentence would sit there in grey,
     which gives the line away before it is read. */
  .ch{position:relative;visibility:hidden;color:var(--pale)}
  /* How long one character takes to go from pale to ink. Set against the step
     between characters rather than fixed, because the two together are what
     the writing looks like: at the home page's 60ms step a 150ms ink leaves
     two and a half characters pale at once — a short, sharp edge. Left at 150
     while the step is shortened, that edge stretches to eleven characters and
     the writing stops being a hand and becomes a grey smear. Tied to the step,
     the edge is the same two and a half characters at any speed. */
  .on .ch{animation:ink var(--ink,150ms) linear forwards}
  @keyframes ink{
    from{visibility:visible;color:var(--pale)}
    to  {visibility:visible;color:var(--ink)}
  }
  /* The campaign's line is drawn to the scroll rather than played to a clock,
     so its characters are switched on one at a time from script instead of by
     an animation. Same three states the writing has everywhere else: ink for
     what has been written, pale for the last couple still landing, and the
     block sitting on the one at the edge. */
  .camp-head .ch.shown{visibility:visible;color:var(--ink)}
  .camp-head .ch.edge{color:var(--pale)}
  .camp-head .ch.tip::after{
    content:"";
    position:absolute;
    left:0;
    top:.12em;
    width:1ch;
    height:.92em;
    background:var(--pale);
    opacity:.72;
  }

  /* The block that marks where the words are entering. It fills the cell of
     the character arriving right now — one column wide, since the face is
     monospaced — holds for that character's slot and then gets out of the way,
     leaving the pale letter to darken behind it. It inherits the letter's own
     delay, so it advances in lockstep and can never drift. */
  .on .ch::after{
    content:"";
    position:absolute;
    left:0;
    top:.12em;
    width:1ch;
    height:.92em;
    background:var(--pale);
    opacity:0;
    animation:caret var(--per,60ms) linear forwards;
    animation-delay:inherit;
  }
  @keyframes caret{0%,96%{opacity:1} 97%,100%{opacity:0}}


  /* The circle. Filled at rest, hollow under the cursor. Press for another. */
  .ring-button{
    -webkit-appearance:none;appearance:none;
    background:none;border:0;padding:0;margin:0;
    display:flex;align-items:center;justify-content:center;
    height:2rem;font-size:1.5rem;line-height:1;color:var(--chrome);cursor:pointer;
  }
  @media (min-width:64rem){ .ring-button{font-size:1.875rem} }
  .ring{
    display:inline-block;
    width:.875em;height:.875em;
    border-radius:50%;
    background:currentColor;
    border:2px solid transparent;
    transition:background-color .2s,border-color .2s,transform .2s;
  }
  /* Hollow while a line is being written, filled once it has landed. */
  /* Hollow means one thing and one thing only: the mark is working. The circle
     empties while a line is being written and the square while a sheet is
     being fetched, and they fill again the moment it has landed. It used to
     empty under the cursor as well, which said the same thing about nothing
     happening at all — so a mark at rest read as a mark mid-task. */
  .ring.hollow{background:transparent;border-color:currentColor}
  /* The arrow is drawn out of its own borders — the two transparent ones are
     what make its point. Hollowing it the way the circle and the square hollow
     paints those in, and it stops being an arrow and becomes a block. It keeps
     its shape and answers the pointer by stepping back instead. */
  .ring-button:hover .ring.arrow,
  .ring-button:focus-visible .ring.arrow{
    background:none;
    border-top-color:transparent;
    border-bottom-color:transparent;
    border-right-color:currentColor;
  }
  /* Written against the lit state, or the rule that brings it up would win. */
  footer.in-camp #back:hover,
  footer.in-camp #back:focus-visible{opacity:.5;transition:opacity .2s}
  .ring-button:active .ring{transform:scale(.88)}
  .ring-button:focus-visible{outline:none}
  /* The two marks sit side by side under the writing. The square is the same
     mark as the circle — same size, same colour, same hollowing on hover —
     with the corners left on. It hands you a page of the zine. */
  .marks{display:flex;align-items:center;gap:.75rem}
  .ring.box{border-radius:0}

  /* The way back out of a piece of work. Same colour and the same height as
     the circle and the square — it belongs to that row, not to the writing —
     and lying on its side it points at where it takes you. Drawn in borders
     rather than a glyph so it takes its colour from the row and scales with
     the same em the other two do. */
  .ring.arrow{
    width:0;height:0;
    background:none;border-radius:0;border:0;
    border-top:.4375em solid transparent;
    border-bottom:.4375em solid transparent;
    border-right:.76em solid currentColor;
  }
  /* It exists only inside a project. On the home page, in Work, in the bio
     there is nothing to come back from, and an arrow there would be a way out
     of somewhere you are not. It sits at the far end of the row, over the
     second of the two words at the foot. */
  /* It arrives the way everything at the foot arrives — brought up on
     opacity, not switched on. Kept in the row while it is invisible so the
     row does not jump, and deaf to the pointer until it is really there. */
  /* Both things that live at the right of the row are wrapped together and the
     wrapper takes the auto margin. Given one each, the free space is split
     between them and neither ends on the rule. */
  /* The arrow and the line never show at once, and neither may take room from
     the other: side by side in the flow, the invisible one still had its width
     and pushed the visible one a hundred and twenty pixels short of the rule.
     They are stacked on the same point instead — the end of the row, which is
     the end of the rule — so whichever is showing ends exactly there. */
  .marks-end{
    margin-left:auto;position:relative;
    height:2rem;display:flex;align-items:center;
  }
  .marks-end > *{position:absolute;right:0;top:50%;transform:translateY(-50%)}
  #back{
    opacity:0;pointer-events:none;
    transition:opacity .5s ease-out;
  }
  footer.in-camp #back{opacity:1;pointer-events:auto}

  /* Said once you have been here before. Set exactly as the line beside the
     mark is — same face, same size, same colour, same weight of grey — because
     it is the same voice speaking, just from the other end of the row. It ends
     on the rule, like everything else at that edge, and it is brought up on
     opacity as the bio starts being written rather than switched on. */
  .knew{
    font-size:.875rem;color:var(--chrome);
    letter-spacing:.02em;white-space:nowrap;
    opacity:0;transition:opacity .6s ease-out;
    cursor:pointer;pointer-events:none;
  }
  footer.knew-on .knew{pointer-events:auto}
  footer.knew-on .knew:hover{opacity:.8}
  @media (min-width:64rem){ .knew{font-size:1rem} }
  footer.knew-on .knew{opacity:.55}

  /* You arrive at a blank page with a sentence being written on it. Only once
     that has landed does the rest of the furniture turn up — the prompt, the
     circle and the two words together, on one half second. */
  footer{
    padding:0 var(--pad) 1.5rem;
    width:100%;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s linear;
  }
  footer.shown{opacity:1;pointer-events:auto}

  /* Sits directly over the circle. It is not written like the rest — it just
     arrives, once the line above has finished and the page has been still for
     a second. Its height is held so the circle never jumps. */
  /* The foot of the page is a different voice from the writing: the sans, a
     step smaller, a touch of tracking, and slate rather than black. */
  .prompt{
    transition:opacity .4s linear;
    font-family:inherit;
    font-size:.875rem;
    font-weight:400;
    line-height:1.43;
    letter-spacing:.02em;
    color:var(--chrome);
    min-height:1.43em;
    margin:0 0 .6rem;
  }
  @media (min-width:64rem){ .prompt{font-size:1rem} }
  .prompt.gone{opacity:0}

  /* The rule sits under the circle, not over it, and its span is the measure
     for the whole page — nothing on any view reaches past either end of it. */
  .rule{border-top:2px solid var(--chrome);width:100%;margin:.9rem 0 .5rem}

  /* Kept quiet, the way the reference keeps its own: small, plain weight,
     a little tracking, and no rule under them. */
  /* The mark on the left, the two words on the right, both under the rule. */
  .bar{display:flex;align-items:center;justify-content:space-between}
  /* The mark is the way home, from any view — so it is a real button, stripped
     back to exactly what the div looked like and given the same quiet hover
     the two words on the right have. */
  .sig{
    -webkit-appearance:none;appearance:none;background:none;border:0;padding:0;
    font-family:inherit;font-weight:inherit;line-height:inherit;
    font-size:1.5rem;color:var(--chrome);letter-spacing:.01em;
    cursor:pointer;transition:opacity .2s;
  }
  @media (min-width:64rem){ .sig{font-size:1.875rem} }
  /* Set hard against the name, small, on its baseline — so the two read as one
     mark rather than as a name and a caption. Baseline is why they are wrapped
     together: the bar centres what it holds, and a line this much smaller
     would float in the middle of the tall one beside it. The bar also spaces
     its children apart, so the pair takes the auto margin and leaves the two
     words on the right exactly where they were. */
  .sig-wrap{display:flex;align-items:baseline;margin-right:auto}
  .role{
    font-size:.875rem;color:var(--chrome);opacity:.55;
    letter-spacing:.02em;white-space:nowrap;
    /* A word space. It has to be a margin: the pair is a flex row, and flex
       throws away the whitespace written between its children. */
    margin-left:.4em;
  }
  @media (min-width:64rem){ .role{font-size:1rem} }
  /* It belongs to the mark, so it stays on every screen. On a narrow bar it
     gives up size rather than presence. */
  @media (max-width:34rem){ .role{font-size:.75rem;margin-left:.35em} }
  .sig:hover{opacity:.5}
  .sig:focus-visible{outline:none;text-decoration:underline;text-underline-offset:.24em}

  .nav{display:flex;gap:1rem;justify-content:flex-end}
  .nav button{
    -webkit-appearance:none;appearance:none;background:none;border:0;padding:0;
    font-family:inherit;font-size:.875rem;font-weight:400;color:var(--chrome);
    letter-spacing:.02em;text-transform:uppercase;cursor:pointer;
    text-decoration:none;text-underline-offset:.24em;
    transition:opacity .2s;
  }
  @media (min-width:64rem){ .nav button{font-size:1rem} }
  .nav button:hover{opacity:.5}
  .nav button[aria-pressed="true"]{text-decoration:underline}

  /* Work: six pieces, two across and three down, in the outer two thirds. The
     line about whichever one is pointed at has the third that is left. They are
     long because the height is only ever what six rows can have without the
     page scrolling — the width is not negotiable. */
  /* The pictures are the outer two thirds and nothing else is: the third they
     leave is where the line turns up. It is never empty — with nothing pointed
     at, it says the one thing all six have in common. */
  .work{position:relative;width:100%}
  /* The two axes are set apart, not together. Measured the same they do not
     read the same: the bands between the rows run the full width of the block
     and the channel between the columns only its height, so at equal thickness
     the wider band carries more white and sits heavier. The row gap is pulled
     in by 2px to answer for it. These are the two numbers to turn if the
     correction is wanted the other way round. */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:12px;
    row-gap:10px;
    padding:0;margin:0 0 0 auto;width:66.6667%;
  }
  .tile{margin:0}
  /* The pieces are not written on, they are simply brought up — all six at
     once, on the same half second the prompt over the circle uses. */
  /* `up`, not `on` — `.on` is the writing trigger, and sharing the name meant
     the grid switched the letters on before typeInto could control them. */
  /* Eased rather than linear, so it reads as something coming up rather than
     a switch being thrown — but brisk, since it is the answer to a click. */
  .tile{opacity:0;transition:opacity .6s ease-out}
  .grid.up .tile{opacity:1}
  /* Corners softened to about the radius of the circle at the foot. The row
     spans the stage and the picture fills its column, so its right edge lands
     exactly on the end of the rule below. */
  .tile .shot{
    border-radius:10px;
    overflow:hidden;
    background:#f1f1f1;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s ease-out;
  }
  /* Height is handed down from script, in pixels: six rows have to divide the
     screen exactly, and no ratio can know how much screen there is. */
  .tile img{display:block;width:100%;height:var(--shot-h,120px);object-fit:cover}

  /* Point at one and the other pictures go back 30%; the one under the cursor
     comes forward. The pop is entirely in the easing — it overshoots 1.02 and
     settles back, which is what makes it read as a knock rather than a zoom. */
  /* The exemption has to out-weigh the rule it is exempting from: written as
     `.tile:hover .shot` it carries one selector less than the line above and
     loses, which darkens the very piece being pointed at. */
  .grid:hover .tile .shot{filter:brightness(.7)}
  .grid:hover .tile:hover .shot{filter:none;transform:scale(1.02)}

  /* One line at a time, and it belongs to whichever piece is under the cursor.
     It sits where the writing sits on the home page — the left of the stage,
     halfway down — so pointing at a piece answers in the same place the site
     speaks from everywhere else.

     It is set exactly as the writing on the home page is — same face, same
     sizes at the same widths, same leading, and starting at the left margin.
     It wraps rather than shrinks: the size is the home page's and is not
     negotiable, so in half the screen the longer lines take two rows. */
  .work .hover-line{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:33.3333%;
    /* Room between the writing and the pictures. At 1.5rem the longest line
       came within a few pixels of the first thumbnail and read as touching. */
    padding-right:4rem;
    margin:0;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:1.125rem;
    line-height:1.625;
    text-align:left;
    pointer-events:none;
  }
  @media (min-width:48rem){ .work .hover-line{font-size:1.25rem} }
  @media (min-width:64rem){ .work .hover-line{font-size:1.875rem} }
  /* The writing is animated on an inner block, so the outer one keeps the
     half-height offset that centres it and the two never fight. A line never
     swaps under you: the one leaving drops out first, the one arriving comes
     up into its place. `pre-line` is what lets a line be written as two
     sentences, one under the other. */
  /* Its own class, not `span`: the writing puts one span round every character
     inside this one, and a bare `span` here reaches those too — they each take
     the block display meant for their parent and the line comes out stacked one
     letter per row. */
  .work .hover-line .ink{
    display:block;
    white-space:pre-line;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .14s ease-out,transform .14s ease-out;
  }
  .work .hover-line.lit .ink{opacity:1;transform:none}

  /* Its room is held from the start, empty or not. Letting it take up height
     only once it is written shunts the whole grid upward mid-animation. */
  /* Inside a campaign: the name written large, and nothing else until it has
     landed. Then the rest is brought up together on the same half second the
     page uses everywhere. */
  main.full #stage{height:100%;margin:0}
  .camp{display:flex;flex-direction:column;height:100%;gap:3.5rem}
  .camp h1{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-weight:400;
    /* The same face at the same weight as everything else. Only bigger —
       no tightening, no heavier cut. */
    /* The same size as the writing on the opening screen — no bigger. */
    font-size:1.125rem;
    line-height:1.625;
    margin:0;
    white-space:nowrap;
  }
  @media (min-width:48rem){ .camp h1{font-size:1.25rem} }
  @media (min-width:64rem){ .camp h1{font-size:1.875rem} }

  /* ── A campaign read in two columns ────────────────────────────────────────
     The name and one line hold still on the left; the executions go down the
     right. Scrolling the right column swaps the line: the old one is taken
     back letter by letter, then the new one is written in its place. */
  /* Label and piece live in the same row, so they line up with each other by
     construction instead of by arithmetic. The rows scroll; the one in view is
     at full strength and the next shows faintly beneath it. */
  /* The campaign is two columns that do different things. The left one does not
     move at all: the name sits there for as long as you are in the campaign.
     Only the line under it changes, and it changes to name whatever piece is
     beside it. The right one is the only thing that scrolls. */
  .camp.split{
    display:grid;
    grid-template-columns:minmax(12rem,38%) 1fr;
    gap:3rem;
    align-items:center;
    height:100%;
  }
  /* Only the name counts towards the column's height, and the line hangs below
     it out of the flow. Left in the flow, a two-line note makes the block
     taller, the column re-centres, and the name — the one thing that is meant
     to be nailed down — shifts every time the scroll moves on. */
  .camp-head{position:relative;display:block}
  .camp-head h1{margin:0}
  /* The name is fixed; this is the part that answers to the scroll. It is
     never swapped under you — the line leaving drops out first and the one
     arriving comes up into its place, the same way Work answers a hover. */
  .camp-head .camp-line{
    position:absolute;
    top:calc(100% + .9rem);
    left:0;
    right:0;
    display:flex;
    flex-direction:column;
    gap:.9rem;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .14s ease-out,transform .14s ease-out;
  }
  .camp-head.lit .camp-line{opacity:1;transform:none}
  .camp-head .note:empty{display:none}
  /* The campaign is not written on arrival — it comes up whole, on opacity,
     with the name and its text already in place beside each other. */
  .camp-scroll{
    opacity:0;
    /* The same 600ms the picture takes to fly in and the idea takes to be
       written, so all three finish together. Left longer, the writing happened
       behind a half-transparent page while the picture — laid over everything
       at full strength — had already arrived. */
    transition:opacity .6s ease-out;
    height:100%;
    overflow-y:auto;
    /* `proximity`, not `mandatory`. Mandatory refuses to hold any position
       between two rows — asked for seven points across one gap it accepted
       only the two ends — and the line under the name is drawn from exactly
       that in-between position. With nowhere to be but at a row, there was
       nothing to draw and the words could only ever change all at once.
       Proximity still gathers you onto a piece when you come to rest. */
    scroll-snap-type:y proximity;
    scrollbar-width:none;
  }
  .camp-scroll.lit{opacity:1}
  .camp-scroll::-webkit-scrollbar{display:none}
  /* Height and the padding above and below are set in script, in pixels: a
     percentage height would resolve against a content box that the padding
     itself changes, and the two would chase each other. */
  /* A row is now only the piece — its name moved out to the fixed column. */
  .step{
    display:flex;
    align-items:center;
    scroll-snap-align:center;
    opacity:.2;
    transition:opacity .5s linear;
  }
  .step.now{opacity:1}
  .camp-head .note{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.875rem;
    line-height:1.6;
    margin:0;
  }
  .step-media{display:flex;align-items:center;justify-content:flex-start;max-height:100%}
  /* Every piece runs the full width of its column, which ends where the rule at
     the foot ends. One measure for the whole campaign — the opening thumbnail,
     the films and the stills all land on the same two edges. */
  .step-media img,
  .step-media video{
    display:block;
    width:100%;height:auto;
    max-width:100%;
    max-height:100%;
    background:transparent;
  }
  /* The stand-in for real fullscreen, for a browser that will not give it up.
     Fixed to the viewport rather than to the column, over everything, black
     behind it so the film is the only thing in the room. `inset` and the
     explicit maxima are needed because the rules above are more specific than
     any of this would be on its own. */
  .step-media video.blown{
    position:fixed;
    inset:0;
    z-index:200;
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    background:#000;
    object-fit:contain;
  }
  body.blown-out{overflow:hidden}
  /* Three pieces sharing one frame. It runs the full width of the cell so no
     single sticker is left at a third of 74%; the frame is proportioned so the
     row still lands at the same height as the 16:9 ones. */
  .step-media img.strip{max-width:100%}
  /* An upright piece cannot run the full width the way the flat ones do — this
     one is 300x534, and taken to the width of the column it would stand 1362
     tall, or lose four fifths of itself to a crop. So its frame takes the full
     width instead, landing on the same two edges as everything else, and the
     film is centred in it — on the same middle as the thumbnail above. */
  .step-media.center{justify-content:center;width:100%}
  .step-media img.upright{width:auto;max-width:100%}
  /* Held to the column's height with its own shape kept: the width follows the
     picture rather than the measure, so it lands whole inside the stop instead
     of running past it. */
  .step-media img.fit{width:auto;height:auto;max-width:100%}
  /* The one picture that is a door. Sized to what a phone camera can still
     read off a screen, and it keeps the pointer that says so. */
  .step-media .media-link{display:block;line-height:0;max-width:100%}
  .step-media .media-link img{display:block;width:min(52%,320px);height:auto}
  /* A row that is a way out rather than a thing to look at: the whole piece is
     the line you press. It keeps the column's measure and none of its depth. */
  .media-text-link{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.875rem;line-height:1.6;
    color:inherit;text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:2px;
  }
  .media-text-link:hover{opacity:.55}
  /* Four tracks, a line each. The only row on the site whose piece is a sound
     and not a picture, so it is given the least furniture that still lets you
     press play: the cover the album shipped with, the number the comment left,
     and the browser's own transport. */
  /* Four tracks, one under the other, filling the same column a picture gets
     so the row carries the same weight as the ones around it. The cover is
     kept square — it is the keypad, and the keypad is square. */
  /* Two handsets and the code they were scanned from, on one line. The phones
     take the height of the row and the code sits between them at a size a
     camera can still read. */
  .step-media.phones-cell{width:100%}
  /* All three sit inside the column's own measure — nothing here is reached by
     scrolling sideways. The handsets take the row's height and give up width
     before the code does, so the code stays big enough to be read. */
  .phones{
    width:100%;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,2.4vw,40px);overflow:hidden;
  }
  /* Equal shares of whatever the code leaves, and each handset fitted inside
     its share — so both are always on the page and neither is reached by
     scrolling sideways. */
  .phones .phone{
    flex:1 1 0;min-width:0;width:auto;
    height:100%;max-height:100%;max-width:100%;
    object-fit:contain;
  }
  .qr-link{flex:0 0 auto;display:block;line-height:0}
  .qr-link img{display:block;width:clamp(110px,15vw,240px);height:auto}
  .qr-link:hover{opacity:.7}

  /* The block runs the full measure of the column, the same two edges every
     picture lands on, and the four tracks divide its height between them. */
  .step-media.beats-cell{width:100%}
  .beats{width:100%;display:flex;flex-direction:column;gap:clamp(10px,1.4vw,20px)}
  /* Each track sits on the same dark card the record's own player used, so the
     four of them read as a tracklist rather than as four loose covers. */
  .beat{
    display:flex;align-items:center;gap:clamp(12px,1.8vw,24px);
    flex:1 1 0;min-height:0;
    background:#111;border-radius:12px;
    padding:clamp(8px,1vw,14px) clamp(12px,1.4vw,20px);
  }
  .beat-title{color:#fff}
  .beat-artist{color:#8a8a8a;font-size:11px;letter-spacing:.04em;margin:0}
  /* The cover is the keypad, so it stays square: it takes the height of its
     own row and its width follows from that. */
  .beat img{height:100%;width:auto;aspect-ratio:1/1;flex:none;object-fit:cover}
  .beat-meta{flex:1;min-width:0}
  .beat-title{margin:0 0 2px;font-size:13px;letter-spacing:.02em}
  .beat audio{width:100%;height:36px;display:block;margin-top:6px}
  /* The idea, in one line directly under the name. A clear step down from it —
     the name is the thing being announced, this is what it means — and written
     short enough to hold to a single line in the column it shares with the
     name. The picture takes the space it used to fill. */
  .camp-head .short{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:1rem;
    line-height:1.625;
    margin:0;
    /* The breaks written into the line are kept; the runs of space between
       words are not, so nothing else about the setting changes. */
    white-space:pre-line;
  }
  /* The piece's own thumbnail, opening the campaign. Its corners match the one
     it was clicked from, so the two read as the same object arriving. Unlike
     the pieces below it, it runs the full width of its column — which ends
     where the rule at the foot ends — so the campaign opens on the same
     measure the rest of the site is built to. */
  .step-media img.opener{
    border-radius:10px;
    width:100%;
    max-width:100%;
    max-height:none;
    height:auto;
  }


  .hint{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.875rem;
    line-height:1.6;
    min-height:1.6em;
    margin:1.5rem auto 0;
  }

  @media (prefers-reduced-motion:reduce){
    .ch{transition:none}
  }

  /* ── On a narrow screen ────────────────────────────────────────────────────
     Nothing here changes what the page is. The two-column reading is a luxury
     of width: given a phone, the same material is laid out one thing under
     another, in the same order, on the same margins, in the same face. What it
     protects is the thing the whole site is for — the work being big enough to
     look at, and the writing big enough to read. */
  @media (max-width:48rem){
    /* The pieces come first. On the desktop the grid takes two thirds and
       leaves a third to the writing beside it; there is no third to spare
       here, and the thumbnails were coming out 228px wide on a 375px screen. */
    .grid{width:100%;margin:0}

    /* And with the grid across the whole width, the line that names what you
       are pointing at had nowhere to sit but on top of the pictures — it was
       being read straight over a thumbnail, halfway down. It comes out of the
       left third, goes back into the flow, and takes its place above them. */
    .work{display:flex;flex-direction:column;gap:.7rem}
    .work .hover-line{
      position:static;transform:none;
      width:100%;padding-right:0;
      top:auto;left:auto;
      /* One line, kept whether or not there is one. Reserved rather than
         measured, so the sum below comes out the same before the line has been
         written and the pictures never re-flow as it changes. Two lines' worth
         was held here at first, which is thirty pixels of nothing on a screen
         with no pointer to hover with: the line only ever reads "Some stuff."
         on a phone. */
      height:1.9em;overflow:hidden;
    }

    /* A campaign stops being two columns and becomes two rows: the name and
       its line above, the work full width below. Kept as a grid so the scroll
       column still gets a bounded height to snap inside — minmax(0,1fr), or a
       tall row would push the column past the foot of the page. */
    .camp.split{
      grid-template-columns:1fr;
      grid-template-rows:auto minmax(0,1fr);
      gap:1.25rem;
    }
    /* Its name is free to break. Held on one line it is the one thing on the
       page that could push a phone sideways. */
    .camp h1{white-space:normal}
    .camp{gap:2rem}

    /* Every piece runs the measure the rule keeps at the foot. The cell is a
       flex box that otherwise takes the width of whatever is in it, so a
       picture with a height set came out at its own proportion and stopped
       short of the line — twenty pixels on one campaign, sixty on another. */
    .step-media{width:100%}
    .step-media img.opener{width:100%}

    /* The head is read once, at the top, so it does not need the height a
       column gave it. */
    /* The line under the name is hung out of the flow on the desktop, where it
       has an empty column to hang into. Stacked, it hung straight over the
       work — the subtitle was being read on top of the pieces scrolling under
       it. Here it goes back into the flow, so the head owns its full height,
       and the head carries the page's own paper behind it so nothing can ever
       show through the writing. */
    .camp-head{
      align-self:start;
      position:sticky;top:0;z-index:2;
      background:var(--paper,#fff);
      /* Room for a name and two lines under it, kept whether or not the second
         line is there. The scroll below starts where this ends, so a campaign
         whose line wraps once was starting its column fifty pixels lower than
         one whose line did not — the work was the same distance down in both,
         but it did not look it. */
      min-height:8rem;
      /* Not pressed against the top edge — the name reads as the start of a
         page rather than as a bar stuck to the frame. */
      padding-top:1.1rem;
      padding-bottom:.85rem;
    }
    .camp-head .camp-line{
      position:static;
      margin-top:.9rem;
    }

    /* One piece at a time, and nothing else. On a wide screen the rows either
       side are held at a fifth so the column reads as a run you are partway
       down; on a phone the column is so short that a fifth of the next row is
       just a strip of something else along the top edge. Only what is in the
       middle of the screen is on it. */
    /* And it goes quickly. Half a second is a fade you can read on a wide
       screen, where the rows either side are meant to be half-there anyway; on
       a phone, where they are meant to be gone, it is long enough to arrive at
       a piece with the last one still lying under it. */
    .step{opacity:0;transition:opacity .22s linear}
    .step.now{opacity:1}

    /* The scroll runs free here. Snap gathered the column onto a row, and a
       row was where the writing in the head came from — but a phone loads its
       pictures while you are already scrolling, every arrival re-measures the
       rows, and the column was still being pulled about under the hand. The
       head no longer answers to the position, so nothing is owed to it. */
    .camp-scroll{scroll-snap-type:none}

    /* Each track takes the height it needs rather than a quarter of a shape
       chosen for a wide screen, and they are given more air between them. */
    .beats{gap:14px}
    .beat{flex:0 0 auto;padding:10px 12px}
    .beat img{height:48px;width:48px}
    .beat audio{height:34px;margin-top:8px}

    /* The two handsets take the column between them and the code drops below.
       Side by side with the code between them, on a screen this narrow, each
       handset was a hundred and seven pixels wide — the game on it could not
       be seen at all. This is the arrangement that makes them biggest: down
       the page as a block, with the two of them across the widest line of it. */
    .phones{flex-wrap:wrap;gap:12px;align-items:flex-start}
    /* The code sits between the two handsets in the markup, so wrapping alone
       broke the line in the wrong place and put each handset on a row of its
       own, full width and half of it off the screen. Ordered, the two of them
       share the first line and the code takes the second. */
    .phones .phone{order:1;flex:1 1 40%;height:auto;max-height:34vh}
    .phones .qr-link{order:2;flex:1 0 100%;display:flex;justify-content:center}
    .phones .qr-link img{width:clamp(110px,30vw,150px)}

    /* The bio is written to sit on one screen with nothing to scroll. When a
       phone is too short to hold it at a legible size, this is what gives. */
    .prose.bio.scrolls{overflow-y:auto;-webkit-overflow-scrolling:touch}

    /* A phone is tall where it is narrow, and the piece was leaving sixty
       pixels of nothing under it. Some of that goes back between the verses,
       where it does some good — not all of it, because the circle and the
       square still need clear air above them. The fitting below will take it
       back if a shorter screen ever needs it. */
    /* The air between the verses was opened up when there was room to spare.
       On a short phone there is not: the piece plus the document under it has
       to land inside the page with nothing to scroll to, and thirty pixels of
       spacing is the difference between that and a C.V. cut off at the fold.
       It is given back only as far as the fitting can afford. */
    .prose.bio p{margin:0 0 .8em}

    /* Set the way the line beside the mark is: lower case, the quieter of the
       two voices at the foot of the page. */
    .cv-link{text-transform:lowercase}

    /* The bio takes the page down to the marks. The margin the rest of the
       site keeps under the writing is room the verse can use here, and it was
       being left empty while the type sat three sizes smaller than it needed
       to be. The foot keeps its own lead above the circle, so nothing crowds
       it. */
    main.reading{padding-bottom:.25rem}
  }

  /* Under a very narrow phone the margins themselves are the luxury. */
  @media (max-width:26rem){
    .grid{column-gap:8px;row-gap:8px}
  }
</style>
</head>
<body>

<main><div id="stage"></div><div class="zine" id="zine"></div></main>

<footer>
  <p class="prompt" id="prompt"></p>
  <div class="marks">
    <button class="ring-button" id="ring" aria-label="Another"><span class="ring"></span></button>
    <button class="ring-button" id="leaf" aria-label="A photograph, and what it turned into"><span class="ring box"></span></button>
    <span class="marks-end">
      <button class="ring-button" id="back" aria-label="Back to the work"><span class="ring arrow"></span></button>
      <span class="knew" id="knew">I already know you.</span>
    </span>
  </div>
  <div class="rule"></div>
  <div class="bar">
    <span class="sig-wrap"><button class="sig" id="btn-sig">SALVA</button><span class="role">is a copywriter.</span></span>
    <nav class="nav">
      <button id="btn-work" aria-pressed="false">Work</button>
      <button id="btn-about" aria-pressed="false">About</button>
    </nav>
  </div>
</footer>

<script>
(() => {
  // Things worth writing down, in no order and for no reason. A line with
  // more than one sentence in it is broken at the full stop and set one under
  // the other, so it lands a beat at a time rather than as a paragraph.
  const LINES = [
    "When someone dives into a movie, I hold my breath to see if I survive.",
    "Walking fast makes you look stupid.\nWalking slow does too.",
    "If there's a bathroom in your dream, don't go in.\nIt's a trap.",
    "Writing badly is bad.\nNot writing is worse.",
    "Birthday Jell-O tastes worse in exact proportion to how many colors it has.",
    "Star Wars bores me.",
    "Cappuccino at any hour, even with a last name like Scala.",
    "Patatas bravas make me mad.",
    "Real soap is bar soap.",
    "Relationships are like fingernails.\nYou never notice them growing until it's time to cut them.",
    "Peeing whenever I want beats staring at clouds.\nAisle seat, no debate.",
    "Popcorn is salty.",
    "I wash my underwear every Sunday.\nI only own seven pairs.",
    "I once asked Santa for a BlackBerry so I could chat with \"the love of my life.\"\nHow embarrassing.",
    "My red Nescafé mug is my favorite.\nThe few days I don't use it end up being bad ones.\nI don't think my life depends on a mug.\nOr does it?",
    "Printers can smell when you're in a hurry.",
    "Some people don't wash their feet in the shower.\nThe one part standing between them and the floor.",
    "You can learn a lot about someone by asking about their first email address.",
    "Asking for condoms at the pharmacy embarrasses me.\nAsking for the morning-after pill embarrasses me more.",
    "Our first teachers are the most important ones, and the first ones we forget.",
    "Reply right away and you come off as intense.\nReply too late and you come off as uninterested.",
    "A single man's best friend is an air fryer.",
    "You could make up a Bible verse and I'd believe you.\nNever read it.",
    "Watching dubbed movies is for psychopaths.",
    "Mom, animation and cartoons are not the same thing.",
    "Young people shouldn't sit down on the metro."
  ];

  // Sits over the circle when you arrive, and goes once you have pressed it.
  const PROMPT = "press the circle below to begin";

  // Set as verse. Every full stop inside a block drops the next sentence onto
  // its own line with nothing between them, and only the blocks are given the
  // blank line — so the beats still read as six, but each sentence lands on
  // its own instead of running into the one after it.
  const ABOUT =
    "Choir and altar boy. Not out of faith, it just got me out of class.\n\n" +

    "Math, sports, art. Everything I was supposed to be good at, I suck at.\n" +
    "The one thing I could do was make people laugh. Dad included.\n" +
    "Until he saw my grades.\n\n" +

    "Communications seemed like the only option. Talking was the only skill I had.\n\n" +

    "My mom told her friends they'd see me on TV one day. She was right.\n" +
    "I wasn't the reporter. I was the news.\n\n" +

    "I still can't explain to my dad what I do for a living.\n" +
    "My best joke was telling him I wanted to live off my creativity.\n" +
    "He quoted Brad Pitt in Once Upon a Time in Hollywood.\n" +
    "\"Fucking hippies.\"\n\n" +

    "I still can't tell the difference between wit and stupidity.\n" +
    "But it pays, so call me whatever you want.";

  // A line each, said the way you would say it out loud, not the way it went
  // in the deck. They only turn up when you point at the piece.
  const WORK = [
    { name: "Back in Smoothly", img: "assets/back-in-smoothly.jpg",
      line: "Nobody reverses well.",
      idea: "A lubricant, advertised on the reverse camera.",
      // `label` is what the name reads as once you have scrolled past the
      // opening row; `note` is the line under it. The two never say the same
      // word twice — the label names the medium, the line says what was done
      // with it.
      execs: [
        // Two of them, each shown twice: the sticker as it was printed and the
        // same sticker as the reversing camera finds it. The pair turns over on
        // the second line, so the print and the screen never stack in a column
        // of their own — the same rule the trash campaign is laid out on.
        { label: "Prints", img: "assets/bis-prints.webp", only: "wide",
          note: "Stuck up in hotel car parks, and in the car parks near them." },
        // On a phone the same four run down the page instead, edge to edge and

    // The thumbnail is one of the close-ups: at the size the home page shows

    { name: "Pick a Side",      img: "assets/pick-a-side.jpg",

    { name: "Numpad Jam",       img: "assets/numpad-jam.jpg",

            { title: "04070477",   src: "assets/numpad-jam-beat1.mp3" },
            { title: "11588361",   src: "assets/numpad-jam-beat2.mp3" },
            { title: "92596",      src: "assets/numpad-jam-beat3.mp3" },
            { title: "2628268286", src: "assets/numpad-jam-beat4.mp3" }
          ] },
        // The block of four, on every screen. Unlike the OOH there is nothing
        // to read on these — four garments photographed flat — so a phone

          note: "Four pieces. Every one of them numbered." },
        // The record itself, on the page it was made on. Last, because it is

        // The name says it; the column beside it is just the way through. No
        // line under the name here — there is nothing to explain that pressing

      ] },
    // The thumbnail is a screen rather than a photograph: the name written in
    // lit pixels on the grid of unlit ones around them, with the phone's own
    // full circle between the two words. Nothing is anti-aliased — a pixel on
    // a display is on or it is off, and the shapes are what the grid can make.
    { name: "Tracking Life",    img: "assets/tracking-life-thumb.webp",
      line: "Count what counts.",
      idea: "A sensor for the one number nobody sells you.",
      execs: [
        { label: "Videocase", note: "",
          video: "assets/tracking-life.mp4",
          poster: "assets/tracking-life-poster.jpg" }
      ] },
    { name: "Movistar",         img: "assets/movistar.jpg",
      line: "Wanna get bored?",
      idea: "Ten seconds of nothing, bought and handed back.",
      execs: [
        // The film was shot upright and stays upright. Its frame still runs the
        // full width of the column, so it sits on the same two edges as
        // everything else, and the film is centred inside it — on the same
        // middle as the thumbnail above it.
        { label: "Film", img: "assets/movistar-still.jpg",
          gif: "assets/movistar.gif", upright: true,
          note: "Ten seconds of it: no sound, no movement, nothing to skip." }
      ] }
  ];

  // What the left third says when nothing is being pointed at. It is written
  // on arrival, at the rhythm the home page writes at, and it is what the line
  // falls back to when the cursor leaves a piece.
  const RESTING = "Some stuff.";

  // Set against the .15s ink transition, this leaves two or three characters
  // pale at the writing edge at any moment — the marker that shows where the
  // words are entering. Measured off the reference, which carries the same.
  const PER = 60;                       // ms between one character and the next
  const INK = 150;                      // how long one character takes to darken
  // How long the clicked picture takes to reach its place in the campaign. The
  // idea underneath the name is written to this same measure, so the two land
  // together rather than one waiting on the other.
  const FLIGHT = 600;

  const stage = document.getElementById("stage");
  const main = document.querySelector("main");
  const footer = document.querySelector("footer");
  const ring = document.getElementById("ring");
  const buttons = {
    about: document.getElementById("btn-about"),
    work: document.getElementById("btn-work")
  };

  // ── The zine ──────────────────────────────────────────────────────────────
  // Three pages, scanned off the cloth they were shot on and left with their
  // own paper: the tone, the grain, the light that fell on them, the comb of
  // tabs along the top edge. Nothing corrected. A page is what the square
  // hands you, and the square hands you another every time it is pressed.
  // Shot on film around Madrid and Toledo, and written off afterwards: the
  // line is not a caption for the picture, it is what looking at it turned
  // into. The square deals one at random, picture first, writing under it.
  // Six sheets, made by hand and scanned: the print pasted in, the note written
  // under it in pen. Nothing here is set by the browser — the page arrives as
  // one photograph, paper grain and all, and a press hands you another.
  const PERSONAL = [
    "assets/zine-1.webp",
    "assets/zine-2.webp",
    "assets/zine-3.webp",
    "assets/zine-4.webp",
    "assets/zine-5.webp",
    "assets/zine-6.webp",
    "assets/zine-7.webp",
    "assets/zine-8.webp",
    "assets/zine-9.webp",
    "assets/zine-10.webp",
    "assets/zine-11.webp",
    "assets/zine-12.webp"
  ];
  const zineLayer = document.getElementById("zine");
  let zineAt = -1;

  // Not a wipe. A wipe is a machine. This is a hand drawing one sheet up over
  // the last, in as many goes as it takes and no two of them the same length:
  // the page is uncovered in bands from the foot upwards, each band held for
  // its own moment, each one landing a hair off the line the one before it
  // left. The whole point is that it is not even — even would read as an
  // animation, and this has to read as paper being moved by somebody.
  const OUT = 260, IN = 500;            // match the transitions on .zine .leaf
  let zineGen = 0;                      // only the newest press gets to land

  // A page comes up on opacity and the one it replaces goes with it. Both lie
  // in the same place, so nothing moves and nothing is revealed — one is
  // simply there instead of the other.
  // A bag, not a dice. Drawing at random meant the same sheet could come up
  // twice in a row's time while another went ten presses unseen. So the twelve
  // are shuffled and then dealt one at a time: every one of them has been in
  // front of you before any of them repeats, and the deck is shuffled again
  // when it runs out — with the seam guarded, so the last of one deal and the
  // first of the next are never the same sheet.
  // The same bag the writing on the home page is dealt from, kept separate
  // because it holds sheets rather than lines.
  let sheetBag = [];
  const dealSheet = () => {
    if (!sheetBag.length) {
      sheetBag = PERSONAL.map((_, i) => i);
      for (let i = sheetBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = sheetBag[i]; sheetBag[i] = sheetBag[j]; sheetBag[j] = t;
      }
      // Dealt off the end, so it is the end that has to differ from the last.
      if (sheetBag.length > 1 && sheetBag[sheetBag.length - 1] === zineAt) {
        sheetBag.push(sheetBag.shift());
      }
    }
    return sheetBag.pop();
  };

  const nextLeaf = () => {
    const mine = ++zineGen;
    const n = dealSheet();
    zineAt = n;
    const shot = PERSONAL[n];

    zineLayer.classList.add("on");
    main.classList.add("leafing");

    // Decoded before it is ever put on the page, so what comes up is a whole
    // sheet rather than one filling in while it fades.
    const leaf = document.createElement("figure");
    leaf.className = "leaf";
    const shotImg = document.createElement("img");
    shotImg.alt = "";
    shotImg.decoding = "async";
    leaf.appendChild(shotImg);

    // The square empties while the sheet is being fetched, the way the circle
    // empties while a line is being written — the mark says the press was
    // heard and something is on its way. One already in the cache never
    // empties at all, because there is nothing to wait for.
    const box = document.querySelector("#leaf .ring");
    const ready = new Promise((done) => {
      shotImg.addEventListener("load", done, { once: true });
      shotImg.addEventListener("error", done, { once: true });
      setTimeout(done, 900);            // a file that never answers still gets its turn
      shotImg.src = shot;
      if (shotImg.complete && shotImg.naturalWidth) done();
      else if (box) box.classList.add("hollow");
    }).then(() => { if (box) box.classList.remove("hollow"); });

    // And the paper is empty before it arrives.
    const standing = zineLayer.querySelector(".leaf");
    const cleared = new Promise((done) => {
      if (!standing) return done();
      standing.classList.remove("up");
      standing.classList.add("down");
      setTimeout(done, OUT);
    });

    Promise.all([ready, cleared]).then(() => {
      if (mine !== zineGen) return;     // a later press has taken this one's place
      zineLayer.replaceChildren(leaf);  // one sheet, always — nothing left under it
      void leaf.offsetWidth;            // let opacity:0 be painted first
      leaf.classList.add("up");
      mosaic(leaf, shotImg, shot, mine);
    });
  };

  // The sheet does not fade in whole. It is cut into a grid, every piece given
  // its own starting blur and its own moment, and the picture assembles itself
  // out of order — the way the tiles do on the page this is taken from. Read
  // off that page's own code rather than guessed at: each piece is a div
  // carrying the whole image as a background, shifted to its own cell, and each
  // is let go after a random wait inside one spread.
  const TILE = 500;                     // what one piece takes to arrive
  const SPREAD = 1000;                  // the window the waits are drawn from
  const BLUR_LO = 12, BLUR_HI = 28;     // each piece starts somewhere in here

  const mosaic = (leaf, img, src, mine) => {
    const lr = leaf.getBoundingClientRect();
    const r = img.getBoundingClientRect();
    if (!r.width || !r.height) return;  // nothing measured, leave the sheet whole

    // Cells kept as near square as the sheet allows, at about two dozen of them.
    const aspect = r.width / r.height;
    const rows = Math.max(3, Math.round(Math.sqrt(25 / aspect)));
    const cols = Math.max(3, Math.round(rows * aspect));
    const cw = r.width / cols, ch = r.height / rows;

    const grid = document.createElement("div");
    grid.className = "mosaic";
    grid.style.left = Math.round(r.left - lr.left) + "px";
    grid.style.top = Math.round(r.top - lr.top) + "px";
    grid.style.width = r.width + "px";
    grid.style.height = r.height + "px";

    const pieces = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        // Whole-pixel edges, so the pieces meet exactly: fractional cells leave
        // hairlines of the page showing through between them.
        const x0 = Math.round(x * cw), x1 = Math.round((x + 1) * cw);
        const y0 = Math.round(y * ch), y1 = Math.round((y + 1) * ch);
        const p = document.createElement("div");
        p.className = "piece";
        p.style.width = (x1 - x0) + "px";
        p.style.height = (y1 - y0) + "px";
        p.style.left = x0 + "px";
        p.style.top = y0 + "px";
        p.style.backgroundImage = "url(" + src + ")";
        p.style.backgroundSize = r.width + "px " + r.height + "px";
        p.style.backgroundPosition = "-" + x0 + "px -" + y0 + "px";
        p.style.filter = "blur(" + (BLUR_LO + Math.random() * (BLUR_HI - BLUR_LO)) + "px)";
        grid.appendChild(p);
        pieces.push(p);
      }
    }
    img.classList.add("ruler");         // it measured the sheet; the grid shows it
    leaf.appendChild(grid);

    pieces.forEach((p) => {
      const wait = Math.random() * SPREAD;
      setTimeout(() => {
        if (mine !== zineGen) return;
        p.style.filter = "";            // back to the sharp state the class carries
        p.classList.add("visible");
      }, wait);
    });
  };

  // Anything else you press puts the zine down. It is a thing you look at, not
  // a place you are in.
  const closeZine = () => {
    if (!zineLayer.classList.contains("on")) return;
    zineLayer.classList.remove("on");
    main.classList.remove("leafing");
    zineLayer.replaceChildren();
  };

  let view = "text";
  let last = -1;

  // The delay lives on each character as a transition-delay, so the run is
  // driven by the compositor rather than by a pile of timers, and it cannot
  // drift out of step with itself.
  // One way of putting words on the page, used for every one of them: the
  // opening line, a thought, the about, and the line under a piece of work.
  // `per` is the gap between one character and the next. It defaults to the
  // rhythm the home page writes at, and is only ever passed in when the writing
  // has to keep time with something else on the page.
  const typeInto = (node, text, per) => {
    const step = per || PER;
    const frag = document.createDocumentFragment();
    [...text].forEach((chr, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = chr;
      s.style.animationDelay = (i * step) + "ms";
      frag.appendChild(s);
    });
    node.replaceChildren(frag);
    node.classList.remove("off");
    node.style.setProperty("--per", step + "ms");  // the block lasts one slot
    // And the wake behind it is always the same two and a half characters,
    // whatever the step. At the home page's 60ms this is the 150ms it has
    // always been; nothing there changes.
    node.style.setProperty("--ink", Math.round(step * 2.5) + "ms");
    node.classList.remove("on");
    void node.offsetWidth;              // let the pale state paint first
    node.classList.add("on");
  };

  // The circle empties out while a line is going down and fills again the
  // moment it has landed.
  let ringTimer;
  const ringWhileWriting = (chars, per) => {
    const dot = ring.querySelector(".ring");
    clearTimeout(ringTimer);
    dot.classList.add("hollow");
    ringTimer = setTimeout(() => dot.classList.remove("hollow"), chars * (per || PER) + 150);
  };

  const write = (text, extra, per) => {
    const p = document.createElement("div");
    p.className = extra ? "prose " + extra : "prose";
    stage.replaceChildren(p);
    typeInto(p, text, per);
    ringWhileWriting([...text].length, per);
  };

  const sync = () => {
    closeZine();                        // any move of the page puts the zine down
    buttons.about.setAttribute("aria-pressed", String(view === "about"));
    buttons.work.setAttribute("aria-pressed", String(view === "work"));
    main.classList.toggle("reading", view === "about");
    main.classList.toggle("wide", view === "work" || view === "campaign");
    main.classList.toggle("full", view === "campaign");
    // The arrow at the foot belongs to a campaign and to nothing else. The
    // flag goes on the footer rather than on main, because the foot of the
    // page is not inside it.
    footer.classList.toggle("in-camp", view === "campaign");
    // The line at the far end belongs to the bio and to nowhere else, and only
    // once you have been there before. Set here rather than where the bio is
    // built, so that leaving takes it away as surely as arriving brings it.
    footer.classList.toggle("knew-on", view === "about" && aboutOpened > 1);
    // The line over the circle belongs to the opening screen and to nowhere
    // else. Leave the home page — for work, for a campaign, for the bio — and
    // it goes, whether or not the circle has been pressed yet.
    prompt.classList.toggle("gone", view !== "text" || promptSpent);
    prompt.classList.remove("on");
    if (view !== "text" || promptSpent) prompt.textContent = "";
    window.scrollTo(0, 0);
  };

  // Drawn rather than rolled for. Rolling a die every press means the same
  // line can turn up twice in three goes and half of them never turn up at
  // all, which reads as a short list badly shuffled. So the whole set is
  // shuffled once and dealt out one at a time, and only when the last one has
  // been dealt is the set shuffled again — every line is seen once before any
  // line is seen twice. The one carry-over: a fresh deal never opens on the
  // line the last one closed on, or the join would look like a repeat.
  let bag = [];
  const deal = () => {
    if (!bag.length) {
      bag = LINES.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      if (bag.length > 1 && bag[0] === last) bag.push(bag.shift());
    }
    return bag.shift();
  };

  // A phone has height to spare where it has no width, so the break between
  // one sentence and the next is opened to a full blank line. On the desktop
  // the tighter setting stands — there the whole piece has to hold together as
  // one block in the middle of the page.
  const homeText = (i) =>
    window.matchMedia("(max-width:48rem)").matches
      ? LINES[i].replace(/\n/g, "\n\n")
      : LINES[i];

  const showText = () => {
    last = deal();
    view = "text";
    sync();
    write(homeText(last));
  };

  const prompt = document.getElementById("prompt");

  let promptTimer;
  let promptSpent = false;              // pressed once, and it is gone for good

  // Pressing the circle retires the prompt from the whole site — not just from
  // this view. Nothing puts it back.
  const clearPrompt = () => {
    promptSpent = true;
    clearTimeout(promptTimer);
    // That timer was carrying two things: the prompt, and the raising of
    // everything else at the foot of the page. Cancelling it to be rid of the
    // prompt took the circle, the square, the rule and the two words with it,
    // and nothing put them back. Whatever else happens here, the furniture is
    // up — it is not the prompt's to take away.
    footer.classList.add("shown");
    prompt.classList.add("gone");
    setTimeout(() => { prompt.textContent = ""; }, 400);
  };

  // The page arrives blank with a sentence being written on it. Once that has
  // landed it holds still for a second, and only then does the rest of the
  // furniture turn up — prompt, circle and the two words, all together.
  const raiseFurniture = (afterMs) => {
    clearTimeout(promptTimer);
    promptTimer = setTimeout(() => {
      if (!promptSpent) prompt.textContent = PROMPT;
      footer.classList.add("shown");
    }, afterMs + 1000);
  };

  // Written at the site's one speed, the same as a line on the home page —
  // no rhythm of its own. Given its own it was three times faster, and two
  // texts writing themselves at two speeds on the same page read as two
  // different mechanisms, however alike the writing edge is made to look.
  // It is a long piece, so it takes as long as it takes.
  // Half the writing speed of the home page. Not a different animation — the
  // wake is still the same two and a half characters, since the ink time is
  // set against the step — only a faster hand.
  const ABOUT_PER = Math.round(PER / 2);

  // Each block is its own element rather than two newlines inside one, which
  // is the only way the space between blocks can be anything other than a
  // whole blank line. The characters go on being numbered straight through
  // all of them, so it is still one continuous piece of writing that happens
  // to be built out of six pieces.
  const typeBlocks = (node, blocks, per) => {
    const step = per || PER;
    let i = 0;
    node.replaceChildren();
    blocks.forEach((block) => {
      const para = document.createElement("p");
      [...block].forEach((chr) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = chr;
        s.style.animationDelay = (i++ * step) + "ms";
        para.appendChild(s);
      });
      node.appendChild(para);
    });
    node.style.setProperty("--per", step + "ms");
    node.style.setProperty("--ink", Math.round(step * 2.5) + "ms");
    node.classList.remove("on");
    void node.offsetWidth;              // let the pale state paint first
    node.classList.add("on");
  };

  // How many times the bio has been opened in this visit. The line at the foot
  // is for somebody who has read it and come back — so it waits for the second
  // time and every time after, and it is forgotten when the page is.
  let aboutOpened = 0;
  let bioNode = null, bioStarted = 0;   // what is being written, and since when
  let bioCv = null;                     // and the document offered under it

  const showAbout = () => {
    view = "about";
    aboutOpened++;
    sync();
    const p = document.createElement("div");
    p.className = "prose bio";
    // The one thing on the site that is a document rather than a piece of
    // work. It waits until the writing above it has landed — offered after the
    // reading, not alongside it.
    const cv = document.createElement("a");
    cv.className = "cv-link";
    cv.href = "assets/salvatore-scala-cv.pdf";
    cv.target = "_blank";
    cv.rel = "noopener";
    cv.textContent = "C.V.";
    stage.replaceChildren(p, cv);
    typeBlocks(p, ABOUT.split("\n\n"), ABOUT_PER);
    bioNode = p;
    bioCv = cv;
    bioStarted = performance.now();
    ringWhileWriting([...ABOUT].length, ABOUT_PER);
    fitBio();
    // Offered when the reading is done, never before it. The first time you
    // open the bio that is the only way it can arrive — you have not been here
    // before, so there is nothing to skip. From the second time on there is
    // also the line at the foot: press it and the writing runs out at once and
    // the document comes with it. Whichever of the two happens first.
    setTimeout(() => {
      if (view === "about") cv.classList.add("on");
    }, [...ABOUT].length * ABOUT_PER + 200);
  };

  // There is to be no scroll on the bio, on any screen. Nineteen lines of
  // verse at a fixed size cannot promise that — a short window will always
  // come along — so the size is not fixed: it is whatever makes the whole
  // piece fit the room it has, and never more than the 18px it is designed
  // at. Height scales with the font size exactly, since the leading is a
  // multiple of it, so one measurement gives the answer outright rather than
  // by trying sizes until one fits.
  const FLOOR = 10;                     // below this it is no longer reading
  const fitBio = () => {
    const node = stage.querySelector(".prose.bio");
    if (!node) return;
    node.style.fontSize = "";           // back to the designed size to measure
    // The room is the page less the document offered under it. Fitted to the
    // whole of it, the verse filled the screen and the C.V. — which sits below
    // it, inside the same box — was pushed off the bottom of the page. That is
    // why it kept going missing on a phone: it was not late, it was outside.
    // The room is everything between the top of the writing and the first
    // mark at the foot, less the document offered under it. Taken as the
    // stage's own height it stopped short: the page keeps a margin below the
    // stage and the foot keeps one above its marks, and those sixty-odd pixels
    // were being left empty while the verse ran off the bottom of the screen.
    const cv = stage.querySelector(".cv-link");
    const marks = document.querySelector("footer .marks");
    const top = stage.getBoundingClientRect().top;
    const floorY = marks
      ? marks.getBoundingClientRect().top - 12   // a breath over the marks
      : top + stage.clientHeight;
    // Whichever is smaller: the space on the page down to the marks, and the
    // box the writing actually lives in. Measured only against the marks, the
    // verse was fitted to a room larger than its own container — the block
    // then overflowed the box, which scrolls, and the C.V. sat just past its
    // bottom edge. Present, painted, and needing a scroll to reach.
    const room = Math.min(stage.clientHeight, Math.max(0, floorY - top)) - (cv
      ? cv.offsetHeight + (parseFloat(getComputedStyle(cv).marginTop) || 0)
      : 0);
    const colW = node.clientWidth;
    if (!room || !colW) return;
    const base = parseFloat(getComputedStyle(node).fontSize);

    // Two things can be too big, and the width is the one that bites first
    // now that sentences share a line. A verse line that runs into the edge
    // of the page and wraps has been broken somewhere nobody chose, which
    // looks like a mistake rather than a line. So the longest is measured as
    // it would actually be set, and the size that keeps it on one row is the
    // ceiling.
    const probe = document.createElement("span");
    probe.style.cssText =
      "position:absolute;left:-9999px;visibility:hidden;white-space:pre";
    probe.style.font = getComputedStyle(node).font;
    document.body.appendChild(probe);
    let widest = 0;
    node.querySelectorAll("p").forEach((para) => {
      para.textContent.split("\n").forEach((line) => {
        probe.textContent = line;
        widest = Math.max(widest, probe.getBoundingClientRect().width);
      });
    });
    probe.remove();

    // Keeping every verse on one row is a rule that only holds while there is
    // width to hold it with. On a phone it drove the size to 7px — the whole
    // piece on screen and none of it readable. So the floor applies here too,
    // and it is a higher floor on a small screen: past that point the line is
    // allowed to wrap, which is the lesser of the two losses.
    // Fifteen was a floor the piece could not always reach: on a short phone
    // it stopped there and ran off the bottom of the screen instead, taking
    // the C.V. with it. Twelve still reads, and it fits.
    const narrow = window.matchMedia("(max-width:48rem)").matches;
    const floor = narrow ? 11 : FLOOR;
    // Keeping every verse on one line is a rule for a page with width to keep
    // it on. A phone has none: the longest line asked for eight-pixel type to
    // hold it, so the piece sat at its floor — a wall of small print with a
    // third of the screen empty under it — and the lines wrapped anyway. There
    // the width is not consulted at all. The verses wrap, and the size is
    // whatever the height can carry, which is a great deal more.
    let size = (!narrow && widest > colW)
      ? Math.max(floor, Math.floor(base * colW / widest))
      : base;
    node.style.fontSize = size + "px";

    // Then down a pixel at a time until the whole piece is inside the room it
    // has. Measured rather than calculated: the leading rounds to whole
    // pixels, so the height is not a straight multiple of the size.
    while (size > floor && node.scrollHeight > room) {
      size--;
      node.style.fontSize = size + "px";
    }

    // There is no scroll on the bio, on any screen. It gave one as a last
    // resort when the piece would not fit at a legible size; with the room now
    // measured honestly — the page less the document under it — the loop above
    // always wins, and a small scrollbar appearing on a phone was the sign
    // that it had not been.
    node.classList.remove("scrolls");
    node.style.maxHeight = "";
  };

  // The name is written first and alone. Only when the last letter has landed
