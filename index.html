  // does anything else arrive, and it arrives all at once.
  // A row is a little shorter than the column, so the next one shows beneath
  // it. That leftover has to be given back as padding at the top and bottom,
  // or the first row can never come to rest in the middle of the page — there
  // would be nothing above it to scroll against.
  const fitCampaign = () => {
    const sc = stage.querySelector(".camp-scroll");
    if (!sc) return;
    // The column's own height, and nothing taken off it. Its height is fixed,
    // so clientHeight does not grow with the padding — subtracting the padding
    // we ourselves set made this shrink a little every time the fitting ran
    // again, and a row that had been exactly centred drifted off centre. The
    // first row was then already a quarter of the way to the next one before
    // the reader had touched anything.
    const H = sc.clientHeight;
    // First of all, because nearly every measurement below asks which of the
    // two the page is being read on.
    const narrow = window.matchMedia("(max-width:48rem)").matches;
    // The gap between one piece and the next is the same everywhere, whatever
    // the pieces are. Rows all one height cannot do that: a long picture and a
    // 16:9 film leave very different amounts of air inside the same box, and
    // the distance from the foot of one to the head of the next changes with
    // every piece. So each row is its own piece plus the gap — half of it
    // above, half below — and the distance between any two is exactly GAP.
    // Ninety-six pixels of air between pieces is generous on a wide screen and
    // most of a phone's column on a narrow one: the opening thumbnail plus its
    // share of that air came to more than a screenful, so the first execution
    // was three flicks away. Half the air on a phone puts it within one.
    const GAP = narrow ? 48 : 96;
    const steps = [...sc.querySelectorAll(".step")];

    // An upright piece is given the height a flat one would have in the same
    // column, so its row is the same depth as every other row and the rhythm
    // of the scroll does not change when you reach it. Set before the rows are
    // measured, not after — measured first, the row would be built around the
    // height the film happened to have at that moment and then the film would
    // change underneath it.
    const flatH = Math.round((sc.querySelector(".step-media")?.clientWidth || 0) * 9 / 16);
    // On a wide screen an upright piece is given the height a flat one would
    // have, so its row is the same depth as every other and the rhythm of the
    // scroll does not change at it. On a phone that shape wastes the screen —
    // a tall film in a narrow column used barely a third of the height it had
    // — so there it takes the room instead, and its width follows from its own
    // proportion.
    const uprightH = narrow ? Math.round(H * 0.82) : flatH;

    // The opening thumbnail runs the full measure, always — from where the
    // rule at the foot starts to where it ends. On a phone it is also cut to
    // one fixed shape for every campaign: the thumbnails are all different
    // proportions, so left alone each one put its first execution a different
    // distance down the page, and no two campaigns scrolled alike.
    //
    // The width has to be set here as well as the height. The cell is a flex
    // box that takes the size of what is in it, so a picture given only a
    // height shrank to its own proportion and took the cell with it — the
    // thumbnail came out eighty pixels short of the rule.
    let openH = 0;
    if (narrow) {
      const cellW = sc.querySelector(".step-media")?.clientWidth || 0;
      openH = Math.round(cellW * 0.42);
      sc.querySelectorAll("img.opener").forEach((im) => {
        im.style.width = "100%";
        im.style.height = openH + "px";
        im.style.objectFit = "cover";
      });
    }
    // Capped, not set: the height is a ceiling the picture stays under, and
    // the width comes from its own proportion. A tall screen recording is far
    // narrower than the films the upright rule is cut for, so given that rule
    // it came out a hundred pixels wide and unreadable.
    //
    // The ceiling is the stop less the gap the column keeps between rows, not
    // the stop itself. Every row's box is its picture plus that gap, so a
    // picture as tall as the stop makes a box taller than the stop — which is
    // how these two came to hang out of the one they were supposed to sit in.
    // A gap short of it, the whole row lands inside, with half the gap clear
    // above and below, the same air every other row has.
    //
    // A piece may ask for a share of that room rather than all of it, and ask
    // for a different share on each screen: the sticker is one object on a
    // plain ground, and on a wide screen taking the whole measure it read as a
    // wall of red — the legend on it was legible long before the picture was
    // that big.
    //
    // The share is put on both sides of the box, not on the height alone. Which
    // of the two is doing the holding depends on the screen — the height on a
    // phone, where the column is narrow and tall, and the width on a desktop,
    // where it is the other way about — so a share given only to the height
    // does nothing at all on half the screens it is asked for.
    const fitH = Math.max(120, H - GAP);
    sc.querySelectorAll("img.fit").forEach((im) => {
      const share = parseFloat(narrow ? im.dataset.fitNarrow : im.dataset.fitWide) || 1;
      im.style.maxHeight = Math.round(fitH * share) + "px";
      im.style.maxWidth = Math.round(share * 100) + "%";
    });
    sc.querySelectorAll("img.upright").forEach((im) => {
      if (uprightH > 0) im.style.height = uprightH + "px";
    });
    // The tracks are given that same height between them, so four of them
    // stacked come to exactly what one flat picture would, and the row keeps
    // the rhythm of the column instead of collapsing to the size of a cover.
    // On a phone that shape works against them: the column is narrow, so a
    // 16:9 block is short, and four cards dividing it are left about forty
    // pixels each — less than the player inside them, which then hung out of
    // its own card and over the next one. There, the tracks are given the
    // height they need instead.
    sc.querySelectorAll(".beats, .phones").forEach((b) => {
      // The phones go the same way on a phone: three things across a 343px
      // column left each handset 107px wide. The code below drops the reader
      // onto its own line, and released from the 16:9 height the two handsets
      // take the width between them instead — half as big again.
      if (narrow) { b.style.height = ""; return; }
      if (flatH) b.style.height = flatH + "px";
    });

    // The handsets are given whatever is left of the column once the code
    // below them has taken its share. Sized off the screen instead — a share
    // of the viewport — they came out right on the one phone they were
    // measured on and hung out of the column on a shorter one, and the block
    // was cut. Here the sum is done against the column that has to hold it.
    if (narrow) {
      sc.querySelectorAll(".phones").forEach((b) => {
        const qr = b.querySelector(".qr-link");
        const gap = parseFloat(getComputedStyle(b).rowGap) || 12;
        const left = H * 0.88 - (qr ? qr.getBoundingClientRect().height : 0) - gap * 2;
        b.querySelectorAll(".phone").forEach((p) => {
          p.style.maxHeight = Math.max(120, Math.round(left)) + "px";
        });
      });
    }
    // The square blocks are the one piece that should take the screen rather
    // than the column's usual depth — four garments in one frame need the room.
    // Held to whichever is smaller, the stop the scroll rests in or the width
    // of the column, so the whole block is always inside the safe zone.
    const colW = sc.querySelector(".step-media")?.clientWidth || 0;
    const bigH = Math.round(Math.min(H * 0.82, colW));
    sc.querySelectorAll("img.big").forEach((im) => {
      if (bigH > 0) im.style.height = bigH + "px";
    });

    const heights = steps.map((s) => {
      // `.beats` first: a tracks row has covers in it, and measuring the first
      // of those instead of the block gave the row the height of a thumbnail —
      // which is what left the pieces above and below it sitting on top of it.
      const m = s.querySelector(".beats, .phones, .media-text-link, img, video");
      const h = m ? m.getBoundingClientRect().height : 0;
      // Before a picture has loaded it measures nothing; fall back to the
      // shape of the column so the rows are never all collapsed at once.
      // The opening row is cut to one fixed height on a phone, so it is taken
      // from that number rather than measured. Measured, a thumbnail that had
      // not been laid out yet fell back to a guess, the row came out fifty
      // pixels taller, and that campaign's first execution sat further down
      // than the others' — the one thing this shape was meant to make equal.
      const fixed = (narrow && openH && s.querySelector("img.opener")) ? openH : 0;
      const guess = fixed || h || Math.round(s.clientWidth * 9 / 16);
      return Math.round(guess) + GAP;
    });
    steps.forEach((s, i) => { s.style.height = heights[i] + "px"; });

    // Which rows are too tall to be brought to rest is worked out in
    // `markCurrent`, on every scroll — the measurement is not reliable this
    // early. See the note there.

    // The first and last rows each have to be able to sit in the middle, and
    // they are not the same height, so they do not get the same padding.
    // Both screens centre the opening row. The phone used to start it forty
    // pixels down from the top instead, to keep the first piece from sitting a
    // screen away — but the saving was thirty pixels and the cost was the whole
    // head: the column's middle then fell a third of the way to the next row,
    // and the name and the idea are written to that position, so a campaign
    // opened with its own name two thirds written and stayed that way. Centred,
    // the opening row is exactly where the column reads it, and it opens
    // written.
    const padTop = Math.max(0, Math.round((H - heights[0]) / 2));
    const padBottom = Math.max(0, Math.round((H - heights[heights.length - 1]) / 2));
    sc.style.paddingTop = padTop + "px";
    sc.style.paddingBottom = padBottom + "px";
  };

  // Which row is the current one is worked out from where the column actually
  // sits, not watched for by an observer. An observer only ever speaks up when
  // something crosses its threshold, so a layout it did not see coming — a
  // video handed back from fullscreen, above all — can leave it silent with no
  // row marked at all. Every row then sits at its dimmed opacity and the page
  // reads as a white wash over the text. Measured, there is always exactly one.
  // The line under the campaign name, swapped as the scroll moves from one
  // piece to the next. Never cut: the line leaving drops out, and only then is
  // the new one put in and brought up, so no text is ever seen changing.
  // The line under the campaign name is not played to a clock — it is drawn to
  // wherever the scroll happens to be. `f` is the position between the rows: 2
  // means the third row is dead centre, 2.5 means exactly halfway to the next.
  // A row at its centre has its line fully written; halfway between two rows
  // there is nothing on the page at all. So the words come away letter by
  // letter as you push down and the next line finishes writing itself exactly
  // as you arrive — and it all runs backwards if you scroll back up, because
  // nothing here is a sequence being played, only a position being read.
  // One element, written to however much of it this scroll position has
  // earned. Same three states the writing has everywhere else: ink for what is
  // down, pale for the last couple still landing, the block on the edge.
  const scrub = (el, text, held) => {
    if (!el) return;

    // The swap happens at the halfway mark, where nothing is showing, so no
    // reader ever sees one line become another.
    if (el.dataset.text !== text) {
      el.dataset.text = text;
      el.classList.remove("on", "off");
      el.replaceChildren(...[...text].map((chr) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = chr;
        return s;
      }));
    }

    const shown = Math.round(held * text.length);
    // The wake and the block belong to a line still being written. A finished
    // one has neither: the block sits over the character it is writing, so on
    // a line that has stopped it just parks on the last one and hides it —
    // which is why a settled sentence was arriving with its full stop missing.
    const writing = shown < text.length;
    [...el.children].forEach((c, k) => {
      c.classList.toggle("shown", k < shown);
      c.classList.toggle("edge", writing && k < shown && k >= shown - 2);
      c.classList.toggle("tip", writing && k === shown - 1);
    });
  };

  // A line is broken where the writing breaks — at the end of a sentence, not
  // wherever the column happens to run out. Anything too long for one line
  // still wraps, but it never starts halfway through the sentence before it.
  const bySentence = (s) => (s || "")
    .split("\n")
    .map((para) => para.replace(/([.!?])\s+(?=[^\s])/g, "$1\n"))
    .join("\n");

  const paintHead = (camp, steps, f) => {
    const head = camp && camp.querySelector(".camp-head");
    if (!head) return;
    const i = Math.max(0, Math.min(steps.length - 1, Math.round(f)));

    // A campaign writing itself in is not overruled by the scroll. The column
    // settles by a pixel as the rows are given their heights, and that one
    // pixel is a scroll event — it arrived six milliseconds after the tap and
    // redrew the head from the position, which wiped the writing before a
    // character of it had been seen. That is why the name and the line simply
    // appeared. The writing is left alone while it is happening, and only
    // while the opening row is still the one in the middle: scroll off it and
    // the head answers to the scroll again at once.
    const until = +(head.dataset.writingUntil || 0);
    if (until && i === 0 && performance.now() < until) return;

    // On a phone the head is played to a clock rather than drawn to the
    // scroll. Drawing it to the scroll is something only a snapped column can
    // afford: it always comes to rest on a row, so the sentence always
    // finishes. The scroll here is free and stops wherever the hand leaves it,
    // and a sentence drawn to that position can stop halfway and stay there —
    // which is exactly what was happening. Written on arrival instead, the
    // same writing happens in the same hand, letter by letter, and it always
    // finishes. It is written once, when the piece under it changes, and not
    // again on every scroll that follows.
    if (window.matchMedia("(max-width:48rem)").matches) {
      const wantHead = steps[i].dataset.head || "";
      const wantLine = steps[i].dataset.line || "";
      if (head.dataset.head === wantHead && head.dataset.line === wantLine) return;
      head.dataset.head = wantHead;
      head.dataset.line = wantLine;
      // The name and the line are one hand at one speed, so the step is taken
      // from whichever of them is longer and the pair lands together.
      const n = Math.max(wantHead.length, wantLine.length, 2);
      const per = Math.max(6, Math.round(380 / (n - 1)));
      typeInto(head.querySelector("h1"), wantHead, per);
      typeInto(head.querySelector(".short"), wantLine, per);
      return;
    }

    // A row owns the ground around it, not just the point at its centre. Come
    // within SAFE of it and the column is simply written, whole — the reader
    // is not asked to land on a pixel to be allowed to read it. Only past that
    // does it start coming away, and it has to be all the way gone by the
    // halfway mark, where the next row takes over.
    const SAFE = 0.25;
    const d = Math.abs(f - i);
    const held = d <= SAFE ? 1 : Math.max(0, 1 - (d - SAFE) / (0.5 - SAFE));

    // Both answer to the same position, so they come away together and land
    // together: the campaign's name unwrites as you push down and the medium
    // it is now showing — Prints, Film, Videocase — writes itself into the
    // place the name was, with its own line forming underneath.
    // Two rows of the same piece — the eight prints of one campaign, split in
    // two only because four of them will not fit a screen — carry the same
    // head and the same line. Unwriting a word to write the identical word
    // back reads as a fault, so between two rows that say the same thing the
    // column is simply held. It comes away only at a real change.
    const j = f > i ? Math.min(steps.length - 1, i + 1) : Math.max(0, i - 1);
    const sameAsNeighbour = j !== i &&
      (steps[j].dataset.head || "") === (steps[i].dataset.head || "") &&
      (steps[j].dataset.line || "") === (steps[i].dataset.line || "");
    const hold = sameAsNeighbour ? 1 : held;

    scrub(head.querySelector("h1"), steps[i].dataset.head || "", hold);
    scrub(head.querySelector(".short"), steps[i].dataset.line || "", hold);
  };

  const markCurrent = (sc, paint) => {
    sc = sc || stage.querySelector(".camp-scroll");
    if (!sc) return;
    const steps = [...sc.querySelectorAll(".step")];
    if (!steps.length) return;

    // A piece too tall for the column cannot be brought to rest in it: held in
    // the middle, its top and its bottom are both off the screen, and the stop
    // keeps pulling it back there. Those stop being stops. Worked out here,
    // where it is redone on every scroll, rather than once while the column is
    // being fitted — a picture already in the cache is `complete` before it has
    // been given a width, so the fitting measured a guess and a block that did
    // not fit was treated as one that did. Measured on the piece and not on the
    // row: the row carries its air too, which on a wide screen makes it taller
    // than the column while the picture inside it still fits perfectly.
    const room = sc.clientHeight;
    const narrowNow = window.matchMedia("(max-width:48rem)").matches;
    steps.forEach((s) => {
      const m = s.querySelector(".beats, .phones, .media-text-link, img, video");
      const h = m ? m.getBoundingClientRect().height : 0;
      // A piece taller than the column gets its stop at its top rather than at
      // its middle: you land on the head of it, and from there the scroll is
      // free to run down the rest. Centred, it could never be read — its top
      // and its bottom were off the screen at once and every attempt to reach
      // either was pulled back.
      const free = h > room;
      s.style.scrollSnapAlign = free ? "start" : "";
      if (free) s.dataset.free = "1"; else delete s.dataset.free;
      // A tall piece anchors by its top, a short one by its middle, and the
      // two land a row's worth of air apart — the same flick arrived forty
      // eight pixels further on in one campaign than in another. The tall ones
      // are told to snap that much earlier, so every campaign travels the same
      // distance from its cover to its first piece.
      s.style.scrollMarginTop = (free && narrowNow) ? "48px" : "";
    });

    // Where the middle of the column falls among the rows, as a fraction.
    // Taken from the rows' own boxes rather than from scrollTop, so it stays
    // right whatever padding the fitting has put above and below them.
    const scTop = sc.getBoundingClientRect().top;
    const scBot = scTop + sc.clientHeight;
    const middle = scTop + sc.clientHeight / 2;
    const mids = steps.map((s) => {
      const b = s.getBoundingClientRect();
      // A row taller than the column is judged by the part of it that is on
      // the screen, not by its own centre — which sits a thousand pixels below
      // the page while the piece fills it. Measured the other way, the block
      // could cover the whole screen and the name at the foot still read as
      // the campaign's, because the opening row's centre was nearer.
      if (b.height > sc.clientHeight) {
        const top = Math.max(b.top, scTop), bot = Math.min(b.bottom, scBot);
        if (bot > top) return (top + bot) / 2;
      }
      return b.top + b.height / 2;
    });
    let f = 0;
    if (middle <= mids[0]) f = 0;
    else if (middle >= mids[mids.length - 1]) f = mids.length - 1;
    else {
      for (let i = 0; i < mids.length - 1; i++) {
        if (middle >= mids[i] && middle <= mids[i + 1]) {
          const span = mids[i + 1] - mids[i];
          f = i + (span ? (middle - mids[i]) / span : 0);
          break;
        }
      }
    }
    const nearest = steps[Math.max(0, Math.min(steps.length - 1, Math.round(f)))];

    // The fixed column answers to where the scroll is, letter by letter.
    if (paint !== false) paintHead(sc.parentElement, steps, f);

    steps.forEach((s) => {
      const here = s === nearest;
      s.classList.toggle("now", here);
      // Reaching a row starts its gif; leaving puts the still back, which also
      // winds it to the beginning for next time.
      // All of them, not the first: the pop-up game row carries two handsets,
      // and asking for one left the second one holding its still for good.
      s.querySelectorAll("img[data-gif]").forEach((g) => {
        const want = here ? g.dataset.gif : g.dataset.still;
        if (!g.src.endsWith(want)) g.src = want;
      });
      // A film left behind stops. It holds its place rather than winding back,
      // so scrolling to it again picks up where it was. Playing on in a row
      // nobody is looking at is the one thing it must not do.
      const v = s.querySelector("video");
      // — except one that is filling the screen, by either route. A film over
      // the whole viewport is the only thing being looked at, whatever the
      // column behind it thinks.
      const big = document.fullscreenElement === v || (v && v.classList.contains("blown"));
      if (v && !here && !v.paused && !big) v.pause();
    });
  };

  // A video coming back from fullscreen is re-laid-out over the next frame or
  // two, so nothing is measured until that has happened — and it is measured
  // again a moment later, since the browser is not done moving things at the
  // instant it says it is.
  const settleCampaign = () => {
    if (document.fullscreenElement) return;
    fitCampaign();
    markCurrent();
  };

  // Taking a film to the whole screen, by whatever route the browser will
  // allow. `requestFullscreen` is the one to want, but it is refused in more
  // places than it looks: an embedded view, a webview, a page the permission
  // has not been granted to — and it refuses quietly, which leaves a button
  // that does nothing and no way to tell why. So the request is made, and if
  // it is turned down the film is blown up inside the page instead: fixed to
  // the viewport, over everything, black behind it. Not the same thing, but
  // the same result for the person watching, and it cannot be refused.
  const shrink = (v) => {
    v.classList.remove("blown");
    document.body.classList.remove("blown-out");
  };

  const blowUp = (v) => {
    if (v.classList.contains("blown")) return shrink(v);
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    let ask;
    try { ask = v.requestFullscreen && v.requestFullscreen(); } catch (e) { ask = null; }
    Promise.resolve(ask).then((r) => {
      // A browser that has no requestFullscreen at all resolves undefined, so
      // the absence of an error is not proof that anything happened.
      if (!document.fullscreenElement) throw new Error("not honoured");
    }).catch(() => {
      // iOS puts fullscreen on the video rather than on the document.
      if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); return; } catch (e) {} }
      v.classList.add("blown");
      document.body.classList.add("blown-out");
    });
  };

  // The control's own fullscreen button goes through the same request, and
  // when that request is turned down the browser says so here — which is the
  // only place it says so at all. Catching it means the button the reader
  // actually presses is the one that works: it asks for the real thing, and
  // the moment the answer comes back no, the film is blown up inside the page
  // instead. Nothing to know, nothing to press twice.
  ["fullscreenerror", "webkitfullscreenerror"].forEach((e) => {
    document.addEventListener(e, (ev) => {
      const v = ev.target && ev.target.tagName === "VIDEO"
        ? ev.target
        : document.querySelector(".camp-scroll .step.now video");
      if (!v) return;
      v.classList.add("blown");
      document.body.classList.add("blown-out");
    });
  });

  // Escape gets you back out of the in-page one, the way it does the real one.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const blown = document.querySelector("video.blown");
    if (blown) shrink(blown);
  });

  // Clicking a piece does not cut to its campaign — the picture itself carries
  // you there. A copy of it is laid over the page at the exact place it was
  // clicked and then moved to the place the campaign keeps for it, while the
  // rest of the campaign comes up around it. The real one waits, hidden, and
  // takes over the moment the copy lands, so there is never two of them.
  // Lifting and landing are two separate acts, because on the way out of a
  // campaign the picture has to be lifted off the page BEFORE the page is
  // taken down. Built as one step, there was a moment with the campaign gone
  // and nothing of Work up yet — a white blink with nothing on it at all.
  // Lifted first, the picture is on screen without interruption throughout.
  // Any copy still lying over the page from a transition that has not finished.
  // Clicking through quickly used to leave the previous set behind, and the new
  // set was laid on top of it — six pictures where there should be one.
  const sweepCopies = () => {
    document.querySelectorAll("img[data-fly]").forEach((n) => n.remove());
  };

  const liftThumb = (from, src) => {
    const fly = document.createElement("img");
    fly.dataset.fly = "1";
    fly.src = src;
    fly.alt = "";
    fly.style.cssText =
      "position:fixed;margin:0;object-fit:cover;border-radius:10px;z-index:60;" +
      "pointer-events:none;" +
      "left:" + from.left + "px;top:" + from.top + "px;" +
      "width:" + from.width + "px;height:" + from.height + "px;";
    document.body.appendChild(fly);
    return fly;
  };

  // Ride whatever is scrolled back up to its top, quickly and under its own
  // easing. Snapping is switched off for the ride: left on, it fights every
  // frame of it and the column arrives in jerks.
  const rideToTop = (sc, ms) => new Promise((done) => {
    if (!sc || sc.scrollTop <= 1) return done();
    sc.style.scrollSnapType = "none";
    const start = sc.scrollTop;
    const t0 = performance.now();
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / ms);
      sc.scrollTop = Math.round(start * (1 - (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
    setTimeout(done, ms + 120);         // never hang on a frame that never comes
  });

  const landThumb = (fly, target) => {
    target.style.visibility = "hidden";

    let done = false, watch = null;
    const land = () => {
      if (done) return;
      done = true;
      if (watch) clearInterval(watch);
      target.style.visibility = "";
      fly.remove();
    };

    const launch = () => {
      if (done) return;
      let to = target.getBoundingClientRect();
      if (!to.width || !to.height) { land(); return; }   // nowhere to fly to
      // Make the browser take the starting values before the ending ones are
      // set. Waiting on a frame instead is what made this jump: two frames
      // asked for in a row can be served in the same one, the two sets of
      // values then arrive together, and with nothing to move between the
      // picture simply appears at the far end.
      void fly.offsetWidth;
      const ease = "cubic-bezier(.4,0,.2,1)";
      fly.style.transition = ["left", "top", "width", "height"]
        .map((p) => p + " " + FLIGHT + "ms " + ease).join(",");
      const put = (r) => {
        fly.style.left = r.left + "px";
        fly.style.top = r.top + "px";
        fly.style.width = r.width + "px";
        fly.style.height = r.height + "px";
      };
      put(to);

      // The place it is flying to can move while it is in the air. A phone
      // fetches the campaign's pictures with the campaign already on screen,
      // and every one that arrives re-measures the column under the flight —
      // so the copy came down where the row had been, was taken away, and the
      // real picture was somewhere else. That is the bounce.
      //
      // So the flight is re-aimed as it goes, and re-timed with it: a new end
      // value restarts the transition from wherever the picture has got to, so
      // it is given exactly the time the original flight had left. The picture
      // bends towards the new place and still arrives on the same beat.
      const started = performance.now();
      let until = started + FLIGHT + 60;
      watch = setInterval(() => {
        if (done) return;
        const now = target.getBoundingClientRect();
        if (now.width && now.height &&
            (Math.abs(now.left - to.left) > 0.5 || Math.abs(now.top - to.top) > 0.5 ||
             Math.abs(now.width - to.width) > 0.5 || Math.abs(now.height - to.height) > 0.5)) {
          to = now;
          const left = Math.max(120, FLIGHT - (performance.now() - started));
          fly.style.transition = ["left", "top", "width", "height"]
            .map((p) => p + " " + Math.round(left) + "ms " + ease).join(",");
          put(now);
          until = Math.max(until, performance.now() + left + 60);
        }
        // A transition that never fires must not leave the page with a copy
        // stuck over it and the real picture hidden underneath: the clock ends
        // the flight, not the browser's word for it.
        if (performance.now() >= until) land();
      }, 60);
    };

    // The place it is flying to is sized by the picture that goes in it, so
    // until that picture is there the place has no size worth measuring. Asked
    // too early, the flight ends at a point that does not exist yet and the
    // picture jumps the moment it loads.
    if (target.complete && target.naturalWidth) launch();
    else {
      target.addEventListener("load", launch, { once: true });
      setTimeout(launch, 400);          // never wait on a picture that fails
    }
  };

  let openCampaign = null;              // the piece being looked at, for the way back

  // `fly` is the piece's picture, already lifted off the grid before the grid
  // was taken down — the same copy the way back uses, in the other direction.
  const showCampaign = (w, fly) => {
    view = "campaign";
    openCampaign = w;
    sync();

    const camp = document.createElement("div");
    // Always the two columns. The name sitting fixed beside the pieces is the
    // shape of a campaign now, whether it has one piece or four — left to
    // depend on having executions, the two without any opened full width, with
    // the name stacked above instead of beside.
    camp.className = "camp split";

    // Every row carries its own label and its own piece, side by side, so the
    // two are centred against each other without any arithmetic. Nothing here
    // is written or erased as you move: the rows simply brighten and dim.
    // The fixed column: the name, and under it the one line that changes.
    const head = document.createElement("div");
    head.className = "camp-head";
    const h = document.createElement("h1");
    h.textContent = w.name;
    const lineWrap = document.createElement("div");
    lineWrap.className = "camp-line";
    const shortEl = document.createElement("p");
    shortEl.className = "short";
    shortEl.textContent = w.idea || "";
    lineWrap.appendChild(shortEl);
    head.append(h, lineWrap);
    head.classList.add("lit");
    // What the head already says. On a phone the head is written when the
    // piece under it changes, and the opening row's own line has just been
    // written by the arrival — without this the first scroll would count that
    // as a change and write it a second time, over itself.
    head.dataset.head = w.name;
    head.dataset.line = bySentence(w.idea || "");

    const scroller = document.createElement("div");
    scroller.className = "camp-scroll";

    // The opening row is the name with the idea in one line under it, and the
    // piece's own thumbnail beside them — the same picture that was just
    // clicked, landing in the space the idea used to fill.
    // Some pieces are cut two ways. A wide screen takes the block of four as
    // it was laid out — that is the campaign as it was made — and a phone,
    // which would show the same block at a quarter of the size and none of it
    // readable, takes the same photographs two to a screen instead. A row
    // marked for one is skipped by the other; a row marked for neither is
    // shown on both.
    const want = window.matchMedia("(max-width:48rem)").matches ? "narrow" : "wide";
    const rows = [{ label: w.name, short: w.idea, img: w.img, opener: true }]
                   .concat((w.execs || []).filter((r) => !r.only || r.only === want));

    rows.forEach((r, i) => {
      const step = document.createElement("section");
      step.className = "step";
      step.dataset.i = i;

      // One line, and only one, for whatever row is in view: the idea on the
      // opening row, and on the rest the sentence that says what the piece is.
      // The bare label — Prints, Film, Videocase — is gone: the word it named
      // is inside the sentence anyway, and two lines saying the same thing one
      // above the other was one too many.
      // An empty note is a decision, not a missing one: a row whose name says
      // the whole thing gets no line under it, rather than the name repeated.
      // A sentence to a line. These lines are two short sentences as often as
      // not, and run together they wrap wherever the column happens to end —
      // which breaks one of them in half and reads as a mistake rather than as
      // a line. Broken where the writing breaks, each sits under the other
      // whole. Anything genuinely too long for the column still wraps.
      step.dataset.line = bySentence(r.opener
        ? (r.short || "")
        : (r.note !== undefined ? r.note : (r.label || "")));

      // And the name over it. The opening row carries the campaign's; every
      // row after it carries the medium's, so scrolling down takes the
      // campaign name away letter by letter and puts Prints, or Film, or
      // Videocase in its place.
      step.dataset.head = r.label || "";

      const cell = document.createElement("div");
      cell.className = "step-media";
      if (r.video) {
        const v = document.createElement("video");
        v.src = r.video;
        if (r.poster) v.poster = r.poster;
        v.controls = true;
        v.preload = "metadata";
        v.playsInline = true;
        // The control's own button is left alone; this is a second way in, for
        // the case where that button does nothing.
        v.addEventListener("dblclick", (e) => { e.preventDefault(); blowUp(v); });
        cell.appendChild(v);
      } else if (r.tracks) {
        // The one row that plays rather than shows. Nothing is preloaded: four
        // files would otherwise start fetching the moment the campaign opens,
        // for a row most visitors scroll straight past.
        cell.classList.add("beats-cell");
        const list = document.createElement("div");
        list.className = "beats";
        r.tracks.forEach((t) => {
          const row = document.createElement("div");
          row.className = "beat";
          if (r.cover) {
            const c = document.createElement("img");
            c.src = r.cover; c.alt = "";
            row.appendChild(c);
          }
          const meta = document.createElement("div");
          meta.className = "beat-meta";
          const h = document.createElement("p");
          h.className = "beat-title";
          h.textContent = t.title;
          const who = document.createElement("p");
          who.className = "beat-artist";
          who.textContent = "JPEGMAFIA";
          const a = document.createElement("audio");
          a.src = t.src; a.controls = true; a.preload = "none";
          meta.append(h, who, a);
          row.appendChild(meta);
          list.appendChild(row);
        });
        cell.appendChild(list);
      } else if (r.phones) {
        // Two handsets with the code between them, the way the ad itself was
        // laid out. The phones hold a still until the row is reached; the code
        // is a link, and the only thing in the row you can press.
        cell.classList.add("phones-cell");
        const wrap = document.createElement("div");
        wrap.className = "phones";
        r.phones.forEach((g, i) => {
          const im = document.createElement("img");
          im.className = "phone";
          im.alt = "";
          im.src = (r.stills && r.stills[i]) || g;
          if (r.stills && r.stills[i]) { im.dataset.gif = g; im.dataset.still = r.stills[i]; }
          wrap.appendChild(im);
          if (i === 0 && r.qr) {
            const a = document.createElement("a");
            a.href = r.href; a.target = "_blank"; a.rel = "noopener";
            a.className = "qr-link";
            const q = document.createElement("img");
            q.src = r.qr; q.alt = "Scan to play";
            a.appendChild(q);
            wrap.appendChild(a);
          }
        });
        cell.appendChild(wrap);
      } else if (r.link) {
        // On the middle of the column, where every piece above it is centred.
        // Left to find its own width the line sat against the left edge, which
        // is the one place nothing else in the campaign starts.
        cell.classList.add("center");
        const a = document.createElement("a");
        a.href = r.link;
        a.target = "_blank";
        a.rel = "noopener";
        a.className = "media-text-link";
        a.textContent = r.linkText || "try it yourself";
        cell.appendChild(a);
      } else if (r.img) {
        const im = document.createElement("img");
        im.src = r.img;
        im.alt = r.label;
        if (r.upright) { im.className = "upright"; cell.classList.add("center"); }
        // A piece that has to land whole inside the stop, whatever shape it
        // is. Unlike `upright`, which is cut for a film's proportion, this
        // only says "fit" — the height is capped to the column and the width
        // follows from the picture's own shape.
        if (r.fit) {
          im.classList.add("fit");
          cell.classList.add("center");
          if (r.fitNarrow) im.dataset.fitNarrow = r.fitNarrow;
          if (r.fitWide) im.dataset.fitWide = r.fitWide;
        }
        if (r.big) im.classList.add("big");
        else if (r.strip) im.className = "strip";
        else if (r.opener) im.className = "opener";
        // A gif starts the moment it loads, so the row holds a still frame and
        // only swaps in the moving one once you have scrolled to it.
        if (r.gif) { im.dataset.gif = r.gif; im.dataset.still = r.img; }
        // One piece on the site is a way out of it rather than a thing to look
        // at: the code the ad was scanned from, which still opens the game.
        if (r.href) {
          const a = document.createElement("a");
          a.href = r.href; a.target = "_blank"; a.rel = "noopener";
          a.className = "media-link";
          a.appendChild(im);
          cell.appendChild(a);
        } else {
          cell.appendChild(im);
        }
      }
      step.appendChild(cell);
      scroller.appendChild(step);
    });

    camp.append(head, scroller);
    stage.replaceChildren(camp);
    fitCampaign();

    // The scroll is put back to the top BEFORE anything measures the target.
    // Measured first, the flight was aimed at wherever mandatory snap had just
    // dropped the column — the picture set off across the page to a place that
    // stopped existing the moment the scroll was reset, and then had to appear
    // where it really belonged. Everything below now measures a settled page.
    scroller.scrollTop = 0;

    if (fly) {
      // The campaign writes itself in while its picture travels, and the two
      // finish together: the last character has to have done its darkening by
      // the time the picture lands, so the gap between characters is whatever
      // is left of the flight once that darkening is taken out of it.
      //
      // On a phone one thing is written, and it is the name. Written with the
      // line at a shared step, the name — ten characters against the line's
      // forty — was down inside a tenth of a second, and what you actually
      // watched was the writing carrying on somewhere further down the page:
      // the effect appeared to start at the title and fall to the subtitle.
      // Alone, the name takes the whole flight, at a pace you can see it
      // written at, and the line under it is simply there.
      const narrowNow = window.matchMedia("(max-width:48rem)").matches;
      const nameText = h.textContent;
      const lineText = shortEl ? shortEl.textContent : "";
      const step = (n) => Math.max(4, Math.round((FLIGHT - INK) / Math.max(1, n - 1)));
      if (narrowNow) {
        if (nameText) typeInto(h, nameText, step(nameText.length));
      } else {
        // A wide screen writes both, in one hand at one speed: the step is
        // measured off whichever of the two is longer, so the name is written
        // in the same hand as the line rather than crawling to fill the time.
        const per = step(Math.max(nameText.length, lineText.length, 2));
        if (nameText) typeInto(h, nameText, per);
        if (lineText) typeInto(shortEl, lineText, per);
      }
      head.dataset.writingUntil = Math.round(performance.now() + FLIGHT + 80);
      // The place the picture is flying to is held empty from the first frame,
      // rather than from the frame the flight is aimed on. Otherwise the
      // picture is in two places at once for as long as the aiming waits.
      const seat = scroller.querySelector("img.opener");
      if (seat) seat.style.visibility = "hidden";
    }

    // And the flight is aimed only once the column has been laid out for good
    // — see the fitting below. Aimed as the campaign was built, it was sent to
    // where the opening row stood while the rows were still being measured off
    // pictures that had not been given a width yet; the real fitting then put
    // that row somewhere else, and the picture arrived, was swapped for the
    // real one, and the real one was forty pixels away. That swap is the small
    // correction you see the moment you are inside.
    let aimed = false;
    const aim = () => {
      if (aimed || !fly) return;
      aimed = true;
      const opener = scroller.querySelector("img.opener");
      if (opener) landThumb(fly, opener);
      else fly.remove();
    };

    // A campaign always opens on its first piece. Mandatory snap decides where
    // to settle the moment the rows get their heights, and it does not reliably
    // choose the top — left alone it opened a row down, with the fixed column
    // already naming the second piece.
    // Rows are measured from the pieces in them, so every piece that arrives
    // late has to be measured again when it does.
    scroller.querySelectorAll("img, video").forEach((m) => {
      const again = () => {
        if (view !== "campaign") return;
        fitCampaign();
        markCurrent(scroller, false);
      };
      if (m.tagName === "VIDEO") m.addEventListener("loadedmetadata", again, { once: true });
      else if (!m.complete) m.addEventListener("load", again, { once: true });
    });

    // And once more when the column has actually been laid out. A picture
    // already in the cache is `complete` before it has been given a width, so
    // it gets no load event and the first fitting measured a guess instead of
    // the piece — which is how a block too tall for the screen was still being
    // treated as one that fitted.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (view !== "campaign") return;
      fitCampaign();
      markCurrent(scroller, false);
      aim();
    }));
    // A tab that is not being drawn is given no frames at all, so the line
    // above may never be reached. The copy is never left lying over the page.
    setTimeout(aim, 140);

    markCurrent(scroller, false);   // the opening line is written by the flight, not drawn

    // Nothing is written here. The whole thing comes up on opacity, with the
    // name and its text already sitting beside each other.
    void scroller.offsetWidth;            // let opacity:0 be painted first
    scroller.classList.add("lit");

    // Whichever row is in the middle is the one at full strength; the rest sit
    // back so you can see there is more below. Read straight off the scroll,
    // with no frame scheduled in between: the browser already sends at most
    // one of these per frame, four rows cost nothing to measure, and anything
    // deferred to a frame stops arriving in a tab that has gone to the back.
    scroller.addEventListener("scroll", () => markCurrent(scroller));

    // Proximity snap gathers you onto a row only if the browser decides you
    // came to rest near enough to one, and it will happily leave a piece
    // sitting half off the screen. So the column corrects itself: once the
    // scrolling has actually stopped, whichever row is nearest is brought to
    // the middle. It waits for the stop rather than fighting the hand — the
    // writing between rows is drawn from those in-between positions, and
    // mandatory snap, which refuses to hold them at all, would take it away.
    // Measured off the boxes the browser has actually laid out, and moved with
    // the browser's own centring. Worked out by hand instead, the arithmetic
    // landed eighteen pixels from where snap puts a row, and the two spent the
    // rest of the scroll pulling against each other.
    let restTimer, correcting = false;
    const centreNearest = () => {
      // Not on a phone. The scroll is free there: nothing is gathered onto a
      // row, and the column is never moved out from under the hand.
      if (window.matchMedia("(max-width:48rem)").matches) return;
      const rows = [...scroller.querySelectorAll(".step")];
      if (!rows.length) return;
      const port = scroller.getBoundingClientRect();
      const mid = port.top + scroller.clientHeight / 2;
      let want = null, best = Infinity;
      rows.forEach((s) => {
        const r = s.getBoundingClientRect();
        const d = Math.abs(r.top + r.height / 2 - mid);
        if (d < best) { best = d; want = s; }
      });
      // Already there, near enough that moving would read as a twitch.
      if (!want || best < 4) return;
      // A piece the column cannot hold whole is not brought to rest — see the
      // note where the flag is set.
      if (want.dataset.free) return;
      correcting = true;
      want.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => { correcting = false; }, 700);
    };
    scroller.addEventListener("scroll", () => {
      if (correcting) return;               // its own smooth scroll is not a new one
      clearTimeout(restTimer);
      restTimer = setTimeout(centreNearest, 150);
    }, { passive: true });

    // Safari hands a video back from fullscreen without a document-level
    // event, so the video itself is asked as well.
    scroller.querySelectorAll("video").forEach((v) => {
      v.addEventListener("webkitendfullscreen", () => setTimeout(settleCampaign, 60));
    });
  };

  // Six pieces, one to a row, and none of it may run past the foot of the
  // screen. The width is settled by the layout — the pictures take the right half
  // of the stage, which ends where the rule ends — so all that is left to work
  // out is how tall a row can be for six of them to divide the screen exactly.
  // That is what makes them as long as they are.
  const fitGrid = () => {
    const grid = stage.querySelector(".grid");
    if (!grid) return;
    const cs = getComputedStyle(main);
    // Taken from the stylesheet rather than repeated here, so the optical
    // correction lives in one place and the arithmetic cannot drift from it.
    const gcs = getComputedStyle(grid);
    const gapCol = parseFloat(gcs.columnGap) || 0;
    const gapRow = parseFloat(gcs.rowGap) || 0;
    let room = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

    // On a phone the line sits above the pictures instead of beside them, and
    // height it takes is height the rows cannot have. Read off the line itself
    // rather than assumed from the width: it is only in the flow when the
    // stylesheet has put it there, and that is the one case to answer for.
    const line = grid.parentElement && grid.parentElement.querySelector(".hover-line");
    const stacked = !!line && getComputedStyle(line).position === "static";
    if (stacked) {
      const stack = parseFloat(getComputedStyle(grid.parentElement).rowGap) || 0;
      // Plus a breath at the foot. Filling the box exactly left the last row
      // sitting a finger's width off the circle and the square, as though it
      // were resting on them — but a breath is all it is, and every pixel kept
      // back here is a pixel off the height of all six pictures.
      room -= line.getBoundingClientRect().height + stack + 14;
    }

    // Two across, three down, filling the half the pictures have — the whole
    // of it, from the top of the page to where the writing at the foot begins.
    // Both measurements come from the page and neither from the pictures: the
    // width is half the half, the height is a third of the room. What the
    // pictures are cut to has no say, so they are cropped to fit.
    const cellH = Math.max(40, Math.floor((room - 2 * gapRow) / 3));
    grid.style.setProperty("--shot-h", cellH + "px");

    // Both measurements have to land on whole pixels or the gaps stop matching
    // each other. The rows already did — they come from a floor. The columns
    // did not: `1fr 1fr` across a fractional width gives two 431.333px tracks,
    // and an edge at a third of a pixel is rounded by the renderer, so the gap
    // down the middle draws at 11 or 13 while the gaps across draw at 12, and
    // one column can come out a pixel wider than the other. So the columns are
    // measured out here instead, in whole pixels, and the grid is then pulled
    // in to exactly what they need — it keeps its right edge on the rule, and
    // gives up at most a pixel at the left, where nothing lines up against it.
    grid.style.width = "";
    const cellW = Math.max(40, Math.floor((grid.clientWidth - gapCol) / 2));
    grid.style.gridTemplateColumns = cellW + "px " + cellW + "px";
    grid.style.width = (cellW * 2 + gapCol) + "px";

    // Centred against what the eye actually sees, not against the box. The
    // pictures end where main ends, but the page does not: the foot carries
    // its own lead before the first mark, so the air under the last row reads
    // longer than the air over the first. Measured, that was 18 above and 49
    // below. The band the pictures really sit in runs from the top of the page
    // to the first thing printed at the foot, and they are centred in that.
    // The first thing actually printed at the foot, not the first node: the
    // line over the circle lives there too and is empty on this view, so
    // asking for the first child measured a box with nothing in it.
    // Stacked, there is nothing to optically centre: the grid is no longer the
    // only thing in the box, and the shift computed for it pushed the last row
    // straight through the foot of the page. It simply sits under the line.
    const foot = document.querySelector("footer");
    const firstAtFoot = foot && (foot.querySelector(".marks") || foot.firstElementChild);
    if (stacked) grid.style.marginTop = "0px";
    else if (firstAtFoot) {
      grid.style.marginTop = "0px";
      const padTop = parseFloat(cs.paddingTop) || 0;
      const lead = Math.max(0, firstAtFoot.getBoundingClientRect().top - main.getBoundingClientRect().bottom);
      const band = main.clientHeight + lead;
      const tall = grid.getBoundingClientRect().height;
      // Never past the foot of its own box — the shift only ever eats the
      // padding that is already there.
      const room2 = Math.max(0, main.clientHeight - padTop - tall);
      const shift = Math.max(0, Math.min(room2, Math.round((band - tall) / 2 - padTop)));
      grid.style.marginTop = shift + "px";
    }
  };

  // `back` is the campaign being left, if one is: { w, from } — the piece and
  // where its picture is sitting at the moment WORK is pressed. Everything the
  // way in does, the way out does in reverse.
  const showWork = (back) => {
    view = "work";
    sync();
    // The stage holds two things: the pictures down the right half, and the one
    // line slot in the half they leave.
    const wrap = document.createElement("div");
    wrap.className = "work";
    const hoverLine = document.createElement("p");
    hoverLine.className = "hover-line";
    const ink = document.createElement("span");
    ink.className = "ink";
    hoverLine.appendChild(ink);
    let lineTurn = 0;                   // so a fast sweep across the six cannot
                                        // let an earlier line land after a later one

    // The left half is never empty. With nothing pointed at, it says what all
    // six of them have in common, and that word gets the same treatment as the
    // lines themselves.
    const setLine = (text) => {
      if (ink.textContent === text) return;
      const mine = ++lineTurn;
      hoverLine.classList.remove("lit");        // the one leaving drops out
      setTimeout(() => {
        if (mine !== lineTurn || view !== "work") return;
        ink.textContent = text;
        hoverLine.classList.add("lit");         // and the one arriving comes up
      }, 150);
    };

    const grid = document.createElement("div");
    grid.className = "grid";
    WORK.forEach((w, i) => {
      const fig = document.createElement("figure");
      fig.className = "tile";
      fig.dataset.slug = w.name;          // so a campaign can find its way home

      // The picture is wrapped so the pop has something to scale that clips
      // its own corners; scaling the picture inside a fixed box would read as
      // a zoom into the photograph instead.
      const shot = document.createElement("div");
      shot.className = "shot";
      const img = document.createElement("img");
      img.src = w.img;
      img.alt = w.name;                 // the name lives here, not under the picture
      shot.appendChild(img);

      fig.appendChild(shot);
      // They come up one after another rather than all at once — the six
      // arrive as a run, not as a switch being thrown.
      fig.style.transitionDelay = (i * 70) + "ms";

      // One line at a time: pointing at a piece puts its line in the slot on
      // the left, and looking away takes it out again.
      fig.addEventListener("pointerenter", () => setLine(w.line));
      fig.addEventListener("pointerleave", () => setLine(RESTING));
      // Going in is the way back run backwards. Every picture is lifted off
      // the page first — copies laid over the grid at the exact places they
      // already occupy — and only then is the grid taken down. The five you
      // did not choose fade away one after another, last one first, which is
      // the same run the way back uses in the other order. The one you did
      // choose stays solid and carries you into the campaign.
      fig.addEventListener("click", () => {
        sweepCopies();
        // The five have to be gone by the time the sixth arrives. Left on the
        // old timing they ran 730ms against the flight's 600, so the campaign
        // stood there complete with thumbnails still dissolving over the top of
        // it. Last delay plus the fade now lands just inside the flight.
        const STEP = 40, FADE = 380;
        const leaving = [...grid.querySelectorAll(".tile")].map((tile, k) => {
          if (tile === fig) return null;
          const im = tile.querySelector("img");
          const copy = liftThumb(tile.querySelector(".shot").getBoundingClientRect(), im.src);
          copy.style.transition = "opacity " + FADE + "ms ease-out";
          copy.style.transitionDelay = ((WORK.length - 1 - k) * STEP) + "ms";
          // Each one goes the moment it is done, rather than the whole set
          // waiting on one timer long after the last of them faded.
          copy.addEventListener("transitionend", () => copy.remove(), { once: true });
          return copy;
        }).filter(Boolean);

        showCampaign(w, liftThumb(shot.getBoundingClientRect(), img.src));

        // Set on the next frame so the copies are painted solid first; set in
        // the same one, they would have nothing to fade from.
        requestAnimationFrame(() => leaving.forEach((c) => { c.style.opacity = "0"; }));
        setTimeout(() => leaving.forEach((c) => c.remove()), FADE + STEP * WORK.length + 200);
      });
      fig.style.cursor = "pointer";

      grid.appendChild(fig);
    });

    wrap.append(hoverLine, grid);
    stage.replaceChildren(wrap);
    fitGrid();

    // Wait until every picture is decoded before starting the fade. Fading an
    // empty box and letting the images pop in as they finish decoding is what
    // makes the six look as though they arrived all at once, with no fade at
    // all — the transition had already run on nothing.
    // Waiting on the pictures stops the fade running over empty boxes, but it
    // must never be what you are waiting for — a slow decode should not hold
    // the page. Whichever finishes first wins.
    const shots = [...grid.querySelectorAll("img")];
    const decoded = Promise.all(
      shots.map((i) => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()))
    );
    // Long enough that the pictures always win this race in practice. At 220ms
    // they did not: the fade started on empty boxes, ran its smooth half, and
    // then each picture snapped in as it finished decoding — fluid, and then a
    // hard cut. The timeout is only here so a picture that never arrives
    // cannot hold the page for good.
    // Arriving from the home page the pictures have to be waited for. Coming
    // back out of a campaign they do not: they were decoded when Work was last
    // built and are in hand, and waiting on them again is dead time with the
    // campaign already gone from the screen.
    const raise = () => {
        if (view !== "work") return;

        // Coming back out of a campaign, the piece you were looking at is not
        // one of the six arriving — it is the one already on its way home. Its
        // own square is held empty while its picture travels back to it, and
        // the other five come up around the gap, as though they had been
        // waiting all along for it to drop back into place.
        const home = back && grid.querySelector('.tile[data-slug="' + back.w.name + '"]');
        if (home) {
          home.style.transitionDelay = "0ms";
          home.style.opacity = "1";       // its square is already there, empty
        }

        grid.classList.remove("up");
        void grid.offsetWidth;            // let opacity:0 be painted first
        grid.classList.add("up");

        // The copy is already in the air — lifted before the campaign came
        // down — so all that is left is to tell it where to land.
        if (home && back.fly) landThumb(back.fly, home.querySelector("img"));
        else if (back && back.fly) back.fly.remove();

        // The line is written at the same moment the six come up, at the pace
        // the home page writes at — not faded in after them. The container is
        // lit first because the reveal here belongs to the characters, one at
        // a time, and not to the block holding them.
        hoverLine.classList.add("lit");
        typeInto(ink, RESTING);
    };

    // Arriving from the home page the pictures have to be waited for, or the
    // fade runs on empty boxes. Coming back out of a campaign they do not:
    // they were decoded when Work was last built and are in hand. Waiting then
    // is dead time with the campaign already gone and the copy hanging still
    // in the air — so the way back raises them on the spot.
    if (back) raise();
    else Promise.race([decoded, new Promise((go) => setTimeout(go, 2000))]).then(raise);
  };

  // The circle always gives you another line, from wherever you are.
  ring.addEventListener("click", () => { clearPrompt(); showText(); });

  // And the square always gives you another page of the zine, from wherever
  // you are. It does not take you anywhere: the page you were on is still
  // underneath, and the next press swaps the sheet rather than the view.
  document.getElementById("leaf").addEventListener("click", () => {
    clearPrompt();
    nextLeaf();
  });

  // The arrow is the same door as the word. Rather than a second copy of the
  // way out of a campaign — which is the one journey on the site that has to
  // put a picture back where it came from — it presses Work, and everything
  // that follows is the one implementation.
  document.getElementById("back").addEventListener("click", () => {
    clearPrompt();
    buttons.work.click();
  });

  // The arrow ends where the rule ends. Both the row of marks and the rule
  // run the full width of the foot, so the auto margin in the stylesheet puts
  // its right edge on the end of the line with nothing measured here.

  // Somebody who has read this before does not need to watch it being written
  // again. Pressing the line runs the rest of it out at once — it goes nowhere
  // and changes nothing else — and then the line takes itself away, having
  // said the only thing it had to say.
  //
  // The writing is played by the compositor, one animation per character with
  // its own delay, so the way to hurry it is to rewrite those delays. Only the
  // ones still to come: a character already inked would restart its animation
  // and blink. Which those are is worked out from the clock rather than read
  // off the page — the step between characters is known, and so is the moment
  // the writing began.
  // The rest of the piece runs out inside this, however much of it is left —
  // a fixed step per character was still two and a half seconds with six
  // hundred to go, which is not "quickly", it is just less slowly.
  const RUSH_MS = 420;
  document.getElementById("knew").addEventListener("click", () => {
    footer.classList.remove("knew-on");
    if (!bioNode) return;
    const chars = [...bioNode.querySelectorAll(".ch")];
    const done = Math.max(0, Math.floor((performance.now() - bioStarted) / ABOUT_PER));
    const left = chars.length - done;
    const step = left > 0 ? RUSH_MS / left : 0;
    chars.forEach((c, i) => {
      if (i <= done) return;            // already landed; leave it alone
      c.style.animationDelay = ((i - done) * step) + "ms";
    });
    // The document under the bio waits on the clock the writing would have
    // taken unhurried, which left it a full minute behind the words once they
    // were hurried — it looked as though it never came. Pressing the line asks
    // for the whole page at once, so it is simply there with everything else.
    if (bioCv) bioCv.classList.add("on");
  });

  // The mark is the way home. It answers from every view, including from
  // inside a campaign — which is the one place with a picture possibly still
  // in the air, so anything mid-flight is swept and the open campaign is let
  // go, or Work would later try to fly a piece back to a page that had moved
  // on without it.
  document.getElementById("btn-sig").addEventListener("click", () => {
    sweepCopies();
    openCampaign = null;
    showText();
  });
  buttons.about.addEventListener("click", () => (view === "about" ? showText() : showAbout()));
  buttons.work.addEventListener("click", () => {
    if (view === "work") return showText();
    // Leaving a campaign, the picture goes back the way it came — so where it
    // is standing right now is measured before the page is torn down.
    if (view === "campaign" && openCampaign) {
      const w = openCampaign;
      openCampaign = null;
      const sc = stage.querySelector(".camp-scroll");
      // Wherever you were in the campaign, it rides back up to its opening
      // piece first — that piece is the one that has a place to go back to —
      // and only then is it lifted off and the page changed under it.
      sweepCopies();
      rideToTop(sc, 300).then(() => {
        // Put it exactly at the top before measuring. The ride is for the eye;
        // this is for the arithmetic. Left to the ride alone, a frame it never
        // got served meant the picture was lifted from wherever the column had
        // reached — once from 680px above the screen, so the copy set off from
        // somewhere nobody could see.
        if (sc) sc.scrollTop = 0;
        const opener = stage.querySelector("img.opener");
        showWork(opener
          ? { w, fly: liftThumb(opener.getBoundingClientRect(), opener.src) }
          : undefined);
      });
      return;
    }
    showWork();
  });

  // Going fullscreen fires a window resize. Refitting on that one would size
  // the rows to the fullscreen viewport and then work out which row is in the
  // middle of a column nobody is looking at — pausing the very film that is
  // playing. Everything is left exactly as it was until the film is handed
  // back, and `settleCampaign` refits then.
  window.addEventListener("resize", () => {
    if (document.fullscreenElement) return;
    fitGrid(); fitCampaign(); fitBio(); markCurrent();
  });

  // Leaving fullscreen, measured once the layout has actually settled and once
  // more shortly after, rather than inside the event itself — at that instant
  // the column is still the size it was on the big screen.
  ["fullscreenchange", "webkitfullscreenchange"].forEach((e) => {
    document.addEventListener(e, () => {
      requestAnimationFrame(() => requestAnimationFrame(settleCampaign));
      setTimeout(settleCampaign, 300);
    });
  });

  showText();                           // a line of my own, chosen at random
  raiseFurniture(homeText(last).length * PER);  // everything else, once it lands
})();
</script>
</body>
</html>
